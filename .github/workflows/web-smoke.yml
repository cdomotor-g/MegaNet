# The web app's only mechanical safety net (#130).
#
# The two workflows next to this one are data-refresh jobs: acma-refresh.yml
# writes data/acma-*, stations-snapshot.yml writes stations.json. Neither can
# touch app.js, which is why the front end had no test at all until this existed.
#
# This one is scoped the other way round — it runs on the web app and ignores
# data churn, so a nightly stations snapshot does not launch a browser for
# nothing.
#
# The filter says '*.js' rather than naming the app's scripts, because #129 split
# app.js into a growing list of them (core.js and init.js in M1, ten module files
# in M2, fourteen more in M3, rf-changes.js and workbench.js in M4). A named list
# would have had to be edited by every milestone, and the one that forgot would
# silently have stopped being tested. The epic is done, but the reasoning holds
# for anything added next, so the glob stays. Only the
# repo root matches — test/ is covered by its own entry, and nothing else at the
# root is JavaScript.

name: Web smoke test

on:
  push:
    paths:
      - '*.js'
      - 'index.html'
      - 'styles.css'
      - 'stations.json'
      - 'test/**'
      # The Raspberry Pi end of the SDR link, which test/sdrpi.mjs runs.
      - 'sdr-pi/**'
      # The Access-to-Supabase exchange and the config that routes to it: the
      # gate check is the only thing asserting the verifier still refuses (#173).
      - 'worker/**'
      - 'wrangler.toml'
      # The agent instruction files test/agent-docs.mjs holds to worker/api.js.
      - 'AGENTS.md'
      - 'GEMINI.md'
      - 'llms.txt'
      - '.github/copilot-instructions.md'
      - '.cursor/**'
      # The Inspections check reads its fixture out of the migration, so a
      # change to the matrix has to re-run it (#116).
      - 'db/migrations/**'
      # The Site Maintenance check reads its filled example out of the workbook
      # itself, so replacing the workbook has to re-run it (#117).
      - 'archive/Inspection sheets for printing.xlsx'
      # The help check asserts that every link out of the panel points at a file
      # that exists, so renaming one of those files has to re-run it — otherwise
      # the one push that could break those links is the one push that does not
      # check them (#105).
      - 'docs/**'
      - 'db/README.md'
      # #123's survey artefacts and #124's staging rows are both derived from
      # the historical workbook and from the tools next to it, so a change to
      # any of them has to re-derive both — otherwise a checked-in manifest
      # quietly stops describing the file it claims to describe, or a staging
      # row stops matching the cell it came from.
      - 'tools/ingest/**'
      - 'data/inspections/**'
      - 'archive/QLD All Site Inspections.xlsx'
      # The Bureau's flood warning station lists and what tools/ingest/
      # river_height_stations.py reads out of them (0031, 0032): the same
      # derived-file rule, one document further on.
      - 'archive/river-height-stations/**'
      - 'data/river-height-stations.json'
      # …and the AEP flood level sheets (0032), read by tools/ingest/
      # aep_levels.py, whose slopes also read the file above.
      - 'archive/aep-levels/**'
      - 'data/aep-levels.json'
      # …and HDB's peak flood heights (0037), read by tools/ingest/
      # flood_peaks.py and loaded by the database job.
      - 'archive/flood-peaks/**'
      - 'data/flood-peaks.json'
      # …and the geoid grid that puts the tiles' EGM96 into AHD for the
      # Digital Twin (geoid.js), with the script that makes it: `npm run
      # flood` holds the file to its numbers, `npm run twin` the ground to it.
      - 'data/geoid-ahd-egm96.json'
      - 'tools/build_geoid_grid.py'
      # The Service Level Specifications and what tools/ingest/sls.py reads out
      # of them (0028, 0034, 0038), and the check holding the database's merge
      # of them to the app's. Neither the PDFs nor the files were listed, so a
      # push carrying a new edition alone would have run nothing.
      - 'archive/QLD_SLS_*.pdf'
      - 'archive/NSW_SLS_*.pdf'
      - 'data/sls-*.json'
      - 'tools/check_sls_merge.py'
      # The base station program and the migration that gives its readings a
      # station are one contract across two files, and `npm run logger` is the
      # only thing holding them together — so a push touching either has to run
      # it. db/migrations/** is already listed above.
      - 'logger/**'
      # The bridge's own tests and the database checks run here too (#102) —
      # a push touching either surface has to run them, or the one push that
      # can break the bridge is the one push that does not test it.
      - 'bridge/**'
      - 'tools/check_*.sql'
      - 'tools/ci/**'
      - 'tools/import_stations_json.py'
      # The Dropbox photo sync and the bucket script CI now runs (0035).
      - 'tools/field-photos/**'
      - 'tools/storage_bucket.sql'
      - '.github/workflows/web-smoke.yml'
  pull_request:
    paths:
      - '*.js'
      - 'index.html'
      - 'styles.css'
      - 'stations.json'
      - 'test/**'
      # The Raspberry Pi end of the SDR link, which test/sdrpi.mjs runs.
      - 'sdr-pi/**'
      # The Access-to-Supabase exchange and the config that routes to it: the
      # gate check is the only thing asserting the verifier still refuses (#173).
      - 'worker/**'
      - 'wrangler.toml'
      # The agent instruction files test/agent-docs.mjs holds to worker/api.js.
      - 'AGENTS.md'
      - 'GEMINI.md'
      - 'llms.txt'
      - '.github/copilot-instructions.md'
      - '.cursor/**'
      # The Inspections check reads its fixture out of the migration, so a
      # change to the matrix has to re-run it (#116).
      - 'db/migrations/**'
      # The Site Maintenance check reads its filled example out of the workbook
      # itself, so replacing the workbook has to re-run it (#117).
      - 'archive/Inspection sheets for printing.xlsx'
      # The help check asserts that every link out of the panel points at a file
      # that exists, so renaming one of those files has to re-run it — otherwise
      # the one push that could break those links is the one push that does not
      # check them (#105).
      - 'docs/**'
      - 'db/README.md'
      # #123's survey artefacts and #124's staging rows are both derived from
      # the historical workbook and from the tools next to it, so a change to
      # any of them has to re-derive both — otherwise a checked-in manifest
      # quietly stops describing the file it claims to describe, or a staging
      # row stops matching the cell it came from.
      - 'tools/ingest/**'
      - 'data/inspections/**'
      - 'archive/QLD All Site Inspections.xlsx'
      # The Bureau's flood warning station lists and what tools/ingest/
      # river_height_stations.py reads out of them (0031, 0032): the same
      # derived-file rule, one document further on.
      - 'archive/river-height-stations/**'
      - 'data/river-height-stations.json'
      # …and the AEP flood level sheets (0032), read by tools/ingest/
      # aep_levels.py, whose slopes also read the file above.
      - 'archive/aep-levels/**'
      - 'data/aep-levels.json'
      # …and HDB's peak flood heights (0037), read by tools/ingest/
      # flood_peaks.py and loaded by the database job.
      - 'archive/flood-peaks/**'
      - 'data/flood-peaks.json'
      # …and the geoid grid that puts the tiles' EGM96 into AHD for the
      # Digital Twin (geoid.js), with the script that makes it: `npm run
      # flood` holds the file to its numbers, `npm run twin` the ground to it.
      - 'data/geoid-ahd-egm96.json'
      - 'tools/build_geoid_grid.py'
      # The Service Level Specifications and what tools/ingest/sls.py reads out
      # of them (0028, 0034, 0038), and the check holding the database's merge
      # of them to the app's. Neither the PDFs nor the files were listed, so a
      # push carrying a new edition alone would have run nothing.
      - 'archive/QLD_SLS_*.pdf'
      - 'archive/NSW_SLS_*.pdf'
      - 'data/sls-*.json'
      - 'tools/check_sls_merge.py'
      # The base station program and the migration that gives its readings a
      # station are one contract across two files, and `npm run logger` is the
      # only thing holding them together — so a push touching either has to run
      # it. db/migrations/** is already listed above.
      - 'logger/**'
      # The bridge's own tests and the database checks run here too (#102) —
      # a push touching either surface has to run them, or the one push that
      # can break the bridge is the one push that does not test it.
      - 'bridge/**'
      - 'tools/check_*.sql'
      - 'tools/ci/**'
      - 'tools/import_stations_json.py'
      # The Dropbox photo sync and the bucket script CI now runs (0035).
      - 'tools/field-photos/**'
      - 'tools/storage_bucket.sql'
      - '.github/workflows/web-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Sixty checks, most of them a browser each. The job took ~14 min at
    # fifty-two and was cut off at 15 when seven joined in one push (run 187,
    # stopped at 15:12 with every check it reached green). A limit is there to
    # stop a hang, not to budget the suite, so it sits well clear of the real
    # run time; move it when the suite grows again.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install the harness
        working-directory: test
        run: npm ci

      # playwright-core does not fetch a browser on install, so it is asked for
      # one explicitly. Cached across runs by version, which is pinned in
      # test/package.json.
      - name: Cache Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('test/package-lock.json') }}

      - name: Install Chromium
        working-directory: test
        run: npx playwright-core install --with-deps chromium

      # Fast pre-filter: parses in under a second and fails the job before a
      # browser is ever launched. #130 asks for this to be kept, not replaced.
      - name: Syntax
        working-directory: test
        run: npm run check

      - name: Duplicate top-level names
        working-directory: test
        run: npm run names

      # Also parse-only, also seconds: the load order in index.html is only safe
      # to add to while init.js is the only file that executes at load (#132).
      - name: Only init.js executes at load
        working-directory: test
        run: npm run toplevel

      # Parse-only and instant, and up here for the same reason as the three
      # above: it closes the drift the `catchments` and `mapfade` notes further
      # down both describe. Each of those checks sat in `npm run all` with no
      # step in this file — running for whoever typed it and on no push at all
      # — and both notes end by naming the check that holds the two lists
      # together as the one worth writing. This is it: the scripts in
      # test/package.json, the `all` chain, and every `npm run` step in this
      # file have to name the same set, in both directions. A check CI does not
      # run is a check that is not there; a step naming a script that no longer
      # exists is a job that goes red for the wrong reason, which is why it
      # fails here rather than twenty browser-minutes later (#183).
      - name: CI runs what `npm run all` runs
        working-directory: test
        run: npm run steps

      # Parse-only too. The app was renamed MegaNet → Flood-Net in what people
      # read, while the code's comments, the schema and the repository kept the
      # old name — so a new label written beside one of those comments brings
      # it back on screen. Every string literal, the two pages and the agent
      # files, held to the new name.
      - name: Nothing a person reads says MegaNet
        working-directory: test
        run: npm run brand

      # Node-only and fast, so it runs before a browser is launched. The HFEM
      # codec's tests ARE the specification restated — there is no sample
      # capture, the spec's ten worked examples are the only oracle, and the
      # timestamp table is the trap they exist to hold shut (#153).
      - name: HFEM codec — the spec's own examples round-trip
        working-directory: test
        run: npm run hfem

      # Node-only and fast. The Longley–Rice port has one honest oracle — the
      # NTIA reference library's own numbers — and 53 of them are recorded in
      # test/baseline/itm-vectors.json. A port that drifts by 1e-6 dB fails.
      - name: Longley–Rice port — the NTIA reference vectors
        working-directory: test
        run: npm run itm

      # Node-only and fast. The base station program is the one file here no CI
      # can compile — CRBasic Editor is a Windows application — so this holds it
      # to the two things that can be held without one: that it and
      # db/migrations/0026 name the same rig (a station number, a protocol key,
      # four channel names and an ALERT address, agreed across a Const and a SQL
      # insert with nothing enforcing it), and that its ALERT2 self-test frame
      # decodes back to the address it was built for.
      - name: Base station program — the rig it and 0026 both name
        working-directory: test
        run: npm run logger

      # Node-only and fast. The Serial Monitor's three device modules, each held
      # to the one oracle it has. The off-air decoder against a real burst the
      # 4078 test rig put on air (test/fixtures/sdr/, from agmurf/sdr-alert-
      # decoder): 4079 = 420 and 4080 = 121 under Enhanced iFLOWS, and noise as
      # nothing. The Quansheng codec against every example line in the
      # firmware's own interface document, and the station table it builds
      # from stations.json against the firmware's own lookup. The RTL-SDR
      # driver against a simulated V2, V3 and V4 — no CI runner has a dongle.
      - name: Off-air ALERT decoder — the 4078 rig's real burst
        working-directory: test
        run: npm run alertdsp

      - name: Quansheng ALERT receiver — the firmware document's own lines
        working-directory: test
        run: npm run quansheng

      - name: RTL-SDR driver — a simulated V2, V3 and V4
        working-directory: test
        run: npm run rtlsdr

      # Node only (python3 for one pseudo-terminal). The RTL-SDR on a Raspberry
      # Pi: sdr-pi.js's codec, and sdr-pi/relay.js playing the demo band and the
      # 4078 rig's real burst through the decoder, answering its console over
      # stdio, TCP (Raw and Telnet) and a pseudo-terminal as its serial port,
      # and opening the simulated V3 through rtlsdr.js — read back with the
      # Reader the card uses. No Pi, stick or PuTTY in CI.
      - name: RTL-SDR on a Raspberry Pi — the relay and its protocol
        working-directory: test
        run: npm run sdrpi

      # Chromium. Following the log PuTTY writes instead of a COM port, under
      # the policy a managed browser has (the file picker refused): real files
      # dropped through CDP, then grown, truncated and replaced on disk — a
      # generic card, a Quansheng radio's log, an ERT-A2's RS232 and USB logs,
      # a dropped folder, "Read it once", and the ALERT2 tab's Watch.
      - name: Log-file following — PuTTY's log instead of a port
        working-directory: test
        run: npm run logfollow

      # Chromium, the database stood in for by two routes. A receiver card as a
      # base station: what the Quansheng and ERT-A2 cards post (source serial,
      # the receiver's path, the right time), the receiver's report (an
      # approximate location said as such), history never stamped "now", a
      # refused token stopping, and a demo never sending.
      - name: Serial Monitor as a base station — what each card posts
        working-directory: test
        run: npm run serialingest

      # Chromium, the database stood in for by routes. The Base Stations tab
      # (0049): the list on the database's clock, a station's panel drawn from
      # what it sent, every button sending exactly its request (quotes in a
      # receiver's key and a confirmation included), the smallest settings
      # patch, typing and focus surviving the poll, and nothing for a station
      # that only reports.
      - name: Base Stations tab — what each station said, and what is asked of it
        working-directory: test
        run: npm run basestations

      # Chromium. The Reception Map against a drive built to blame one real
      # repeater: named first by pass ranges alone and with positions; NMEA
      # parsed; a GPS card placing a receiver's receptions; CSV/GeoJSON round
      # trip; and the stored readings — a station's own burst not a flip, a
      # copy nine seconds late found, a ghost told from a look-alike by each
      # address's own reports, a storm's tips kept as reports.
      - name: Reception Map — the bad repeater named
        working-directory: test
        run: npm run reception

      # Chromium, the datastore stood in for by a route. Station Health against
      # a demo week with one of every fault planted: each found where it was
      # planted and the untouched stations clean; raw counts worked out
      # (battery 133 → 13.3 V); the copy, storm and ghost rules on readings
      # built for each; the tab fetched, filtered, a station and a missed check
      # opened; the door to the Reception Map; the agent's tool loop against a
      # scripted client; 375 px. And the Airtime panel: the demo week's one
      # planted clash found, said to hurt, its station moved, nothing else.
      - name: Station Health — every planted fault found where it was planted
        working-directory: test
        run: npm run health

      # Node-only and fast. Station Health with nobody's browser open (#215):
      # tools/health/report.mjs runs the same health-analysis.js over the demo
      # week and reports exactly the analysis' own findings of the kinds it
      # reports — the planted silent station among them, the stations left
      # alone not — to a stand-in for meganet.report_station_findings().
      - name: Station Health reported — the browser's analysis, run unattended
        working-directory: test
        run: npm run healthreport

      # Node-only and fast. The Airtime panel's reasoning on networks built
      # for it: the circle two checks share (the gcd of their periods), how a
      # logger keeps time (steady, drifting, jumped, randomised), damage
      # together against alone, one burst and whole seconds, three on one slot
      # moved clear of each other, a drift said before it arrives, repeater
      # pairs to stagger, and Station Health's ghosts and unfiled sensors.
      - name: Airtime — who lands on top of whom, and what to move
        working-directory: test
        run: npm run airtime

      # A station's health on its card and as its pin's colour (#218), against
      # the demo week through the strict PostgREST stub: last heard, the
      # battery's night lows and the findings, one request a card; each line a
      # door into Station Health on that station, the address saying so; Colour
      # pins by health off by default, one request a load however often the map
      # is rebuilt, never colour alone; and no data said as no data — refused,
      # unreachable, never heard — never as OK.
      - name: A station's health on its card and its pin
        working-directory: test
        run: npm run healthcard

      - name: Smoke — every tab, clean console
        working-directory: test
        run: npm run smoke

      # The half smoke cannot see: it opens every tab, so a tab that never
      # registered its map or its teardown still passes. This one leaves them
      # again (#142).
      - name: Module registries — maps re-measure, teardowns run
        working-directory: test
        run: npm run registry

      # The third thing smoke cannot see, and the simplest: smoke reaches every
      # tab by calling switchTab(id) and never touches the nav, so a tab missing
      # from a group — or filtered permanently out of the list by the find box —
      # is green all the way through. A user has no switchTab() (#108).
      - name: Nav — every tab is in it once, and findable
        working-directory: test
        run: npm run nav

      # The shell and the design system (#109). Everything it asserts is
      # invisible to the checks above: a page renders nineteen tabs with a
      # clean console just as happily with no skip link, no landmark
      # structure, a focus ring that vanishes on half its backgrounds, a nav
      # that drops focus on every tab change, and a palette that fails
      # contrast in the dark theme. It is also what makes #109's instructions
      # to #136–#141 enforceable — a breakpoint outside the scale, or an
      # `outline: none` that is not on the allowlist, fails here.
      - name: Shell — landmarks, focus, contrast, and six breakpoints
        working-directory: test
        run: npm run shell

      # The other half of that, and the half nothing was holding until #137:
      # `npm run shell` asserts #109's system against the shell and *one* tab,
      # by its own comment and on purpose. Six per-tab issues are converting
      # nineteen tabs against a shared Definition of Done, and this is that
      # Definition, checked — inline styles, table captions and scopes, scroll
      # regions, clickable rows, landmark names, accessible names, heading
      # order and sideways scroll, per converted tab. Its list of converted tabs
      # grows as each U-issue lands (#137).
      #
      # It also carries the pattern-level claims that belong to no single tab:
      # the basin drawing's role="img" shortcut condition (#137), and the ARRO
      # chart's palette round trip (#141) — that chart writes literal colours
      # into its SVG so the PNG export can render it, and the whole point of
      # #141 was that those literals come from tokens now. Nothing else can see
      # that; break it and two assertions here go red.
      - name: Tabs — the per-tab Definition of Done, per converted tab
        working-directory: test
        run: npm run tabs

      # Overpass is external and the harness blocks the network, so the rivers
      # check seeds geometry through MapRivers.seed() and asserts what #150
      # shipped: grouping, permanent labels, the map-delegated callout, and —
      # the assertion that matters — a real control in the DOM per named river.
      - name: Rivers — named, labelled, clickable, and reachable without a mouse
        working-directory: test
        run: npm run rivers

      # The road reserve, and the intersections that were missing from it. The
      # DCDB files the crossing square at a junction under its own parcel_typ
      # — 'Unlinked parcel or inter' — so a layer drawing only 'Road Type
      # Parcel' left a hole at every intersection. The check stubs the cadastre
      # with a crossroads whose roads stop dead at the junction, honours the
      # where clause so the fixture really has the hole in it, and asserts the
      # junction is drawn, names the two roads that meet there, and that an
      # unlinked parcel touching no road is still refused.
      - name: Road reserve — drawn whole, intersections included
        working-directory: test
        run: npm run roads

      # The QLD SurveyControl service answers any query carrying
      # resultRecordCount with an empty feature set — HTTP 200, no error field
      # — so a per-layer cap made every mark invisible while the note counted
      # the off-screen margin as "in view" (#120's live spot-check). The check
      # stubs that exact quirk, plus the group layers that only 400 and the
      # join-prefixed field names, and asserts the parameter stays gone, the
      # marks draw, the count is honest, and the map-delegated callout works.
      - name: Survey marks — drawn, counted honestly, reachable through the map
        working-directory: test
        run: npm run survey

      # The on-map panels (#164), and the one thing about them nothing else can
      # see. Every check above reaches the app through switchTab() and
      # page.evaluate(); this one moves a real pointer, clicks a real checkbox
      # inside a flyout, moves the pointer away and asks whether the flyout went
      # with it. It did not — clicking any control inside a panel focused it,
      # and an ungated focusin promoted the panel to open-for-real, so ordinary
      # use of Draw & measure, Base map or Map display welded that panel to the
      # map until its icon was found and clicked again. Nothing threw, no
      # handler went unresolved, no contrast moved: a mouse leaving is the only
      # witness there is.
      - name: On-map panels — they put themselves away, and only the pin keeps one
        working-directory: test
        run: npm run mapctl

      # The coverage overlay is metadata about the terrain, not terrain, and the
      # one way it could mislead is by being taken for a height source. The
      # check holds it to that: silent while off, and a note that keeps saying
      # profiles still read ~30 m ground everywhere.
      - name: Elvis coverage — where the good elevation data is, and no claim beyond it
        working-directory: test
        run: npm run elviscov

      # The service returns prose, including the literal string "No Data" in
      # every field where it holds nothing. Parsed naively that is a NaN height
      # travelling on as a real one, so the parser has its own check — and so
      # does the rule that a modelled height must never read as a surveyed one.
      - name: Elvis at a point — the parse, the datum, and the modelled/surveyed line
        working-directory: test
        run: npm run elvis

      # The comparison this feature lives or dies by: if the tile side were the
      # card's 256-sample run and the Elvis side a 64-sample one, a reported
      # change of verdict would be partly the sample count. Both sides are
      # analysed on the same points, and this is what says so.
      - name: Elvis second opinion — two models, one grid
        working-directory: test
        run: npm run elvisprofile

      # Not a check about code at all: the help panel's *content*. Smoke asserts
      # every tab has a HELP entry, which stops the rail rendering blank and
      # says nothing about what is behind the key. A doc link pointing at a file
      # that has since been renamed, a "see also" naming a tab that no longer
      # exists, and a placeholder that shipped all render a panel that looks
      # entirely right (#105).
      - name: Help panel — every tab explains itself, every link lands
        working-directory: test
        run: npm run help

      # The other half smoke cannot see, for the opposite reason: the
      # Inspections tab renders *from* the datastore, and smoke's network policy
      # aborts every off-origin request — so under smoke the tab correctly says
      # it could not load the form, and the form itself is never drawn. This one
      # answers the datastore out of db/migrations/0009_inspections.sql instead
      # (#116).
      - name: Inspections — the form renders what the matrix says
        working-directory: test
        run: npm run insp

      # Same blind spot, different claim. The Council Maintenance Tasks form
      # does not render from a matrix — there is one sheet — so what it has to
      # be checked against is the piece of paper. This one drives the workbook's
      # own filled example through the form and requires every value on that
      # sheet to be either on screen or named as having no column (#117).
      - name: Site Maintenance — the Council sheet, against the workbook
        working-directory: test
        run: npm run maint

      # The same blind spot again, and worse: the Inspection History tab renders
      # from the datastore *and* every record it shows is editors-only, so under
      # smoke it correctly renders "sign in to read them" and a whole reader goes
      # untested. This one has the app write the records itself — fill the sheet
      # in, save, read it back — so the round trip is the thing under test (#118).
      - name: Inspection History — a record reads back as the sheet it was written on
        working-directory: test
        run: npm run history

      # Smoke opens the Stations tab and asserts nothing threw — which a pill row
      # missing two pills, a document search sending the raw station name, and a
      # Save that writes null over a coordinate all pass cleanly. This one drives
      # the mode: arm it, drag the pin with a real pointer, read the coordinates
      # back off the panel, cancel, save, and assert the map's other interactive
      # modes were taken off on the way in (#170).
      - name: Move pin and the station's links — the mode, the drag, and the pills
        working-directory: test
        run: npm run movepin

      # The clipboard is not a thing anyone double-checks, which is the whole
      # problem: a Copy lat, lon that hands over the *saved* position after a pin
      # has been dragged into the boxes pastes cleanly into a work order and is
      # simply wrong. Same for the station list card — a card that forgets it was
      # shut, or a summary whose count stops being repainted, renders a page that
      # looks entirely correct. This reads the clipboard back for real, and drives
      # the card shut and open through the gesture rather than by setting `open`.
      - name: Copy lat, lon and the collapsible station list
        working-directory: test
        run: npm run stationscard

      # The station card on the map is state, not popup DOM — a filter
      # keystroke rebuilds every marker and destroys the callout, and the card
      # has to still be there afterwards. A card that dies with the markers, a
      # pin click that quietly starts selecting, a close that drops focus on
      # <body>, two cards drawn on top of each other, a phone callout wider
      # than the map: every one renders a page that looks entirely correct and
      # throws nothing. This drives the card from a real pin click at desktop
      # and phone widths, and holds the one-card-at-a-time rule shut (#175).
      - name: The station card — state, not popup DOM, at two widths
        working-directory: test
        run: npm run stncard

      # The stations looked at this session, as a pill in the map's top row
      # (station-trail.js). A trail that forgets a station, lists one twice or
      # keeps the order of the first look rather than the last; a pill that
      # drops under the card it is meant to bring back, wraps to two rows or
      # sits somewhere other than beside the zoom buttons — or, in the twin,
      # beside the flood scale; a pick that moves the map and leaves the old
      # station selected: none of them throws. Driven with real clicks and keys
      # at a desktop's width and a phone's, in and out of the twin.
      - name: The station trail — the pill that brings the card back and goes back to any of them
        working-directory: test
        run: npm run trail

      # Where you are, in the address bar (route.js, #211), and the first load
      # saying what it is doing (#212). A link that opens on the wrong tab, a
      # back button that skips a step or replays every pan, a reload that loses
      # the card, a loading card that says nothing is coming: none of them
      # throws. The server holds stations.json part-way through so the loading
      # card can be read, and every history call is counted.
      - name: Links and the first load — the address says where you are, and loading says so
        working-directory: test
        run: npm run links

      # Ctrl/Cmd+K and 🔎 Search (palette.js, #221): a station, a place, a tab
      # or an action from any tab. A station ranked below its namesakes, an
      # arrow key that moves the highlight but not what Enter opens, a pick
      # that leaves two history steps, a place typed into a box that is not
      # there: none of them throws.
      - name: The palette — Ctrl+K finds a station, a place, a tab or an action
        working-directory: test
        run: npm run palette

      # A first visit and What's new (#222): a browser that has never been here
      # opens the Site Map once, greeted; one that came by a link goes where it
      # says; What's new is shown only to a device with something it has not
      # seen. A greeting that comes back every visit, or one that vanishes when
      # the list lands, would throw nothing.
      - name: A first visit and What's new — the guide once, and only news that is news
        working-directory: test
        run: npm run firstvisit

      # The theme follows the device, and Sunlight (#224), with the device's
      # colour scheme emulated: System at load and as the device changes, a
      # choice made before there were four still standing, the 🌗 menu, the
      # map's heavier lines in Sunlight, the one rule that used to ask the
      # device, and forced colours. Sunlight's contrast is `shell`'s.
      - name: Themes — System follows the device, and Sunlight for the field
        working-directory: test
        run: npm run themes

      # The app asks and tells in its own words (#223): no script calls
      # alert(), confirm() or prompt() (parsed, not grepped); confirmDialog's
      # question, buttons named for what they do, every exit but the button a
      # "no", asked over an open dialog without tearing it down or letting a
      # key past; promptDialog; the toasts and the live region; the call sites
      # people meet first; and the nav's mark for a tab this browser cannot run.
      - name: Dialogs — the app's own questions and toasts, and no browser pop-ups
        working-directory: test
        run: npm run dialogs

      # One Export for what the tab shows (#227): every tab offers something
      # or is exempt with a reason, every offer names a writer the app has,
      # the Stations list gated as the Export tab is, the filtered list as
      # CSV / GeoJSON / KML, five other tabs on their own demo data, and every
      # file named floodnet-….
      - name: Exports — the banner's Export, and every file floodnet-…
        working-directory: test
        run: npm run exports

      # Opens with no signal (#213), with a real service worker: installable;
      # the whole shell kept for the page's version, then the station list and
      # the inspection sheet's tables, the list still streamed to the loading
      # card; a data file changed without a new stamp still the network's;
      # offline, the app from the copy, its list labelled a saved copy with its
      # age, a draft started and saved, an address that is not the app left
      # alone; a new deploy offered, never swapped in; a page that is not the
      # app (Access's sign-in) never kept; and no worker in every other check.
      - name: Offline — opens with no signal, says how old, offers a new deploy
        working-directory: test
        run: npm run offline

      # The 📲 Offline & Install tab: where it is; which browser, from real
      # user-agent strings and three emulated devices, each shown its own way
      # to install (or told it cannot); the browser's install prompt held and
      # offered as a button; no signal; and, with a real worker, one visit
      # keeping the list and the sheets' lists, Start again, and Get ready.
      - name: Offline & Install tab — this device, getting it ready, installing
        working-directory: test
        run: npm run offlinetab

      # Proposed stations (0039) in the editor, on the card and on the map,
      # against a stand-in for save_station() that holds the database's rules
      # (tools/check_proposed_stations.sql holds the real one to them): a
      # proposal missing its type, year or place not sent; a complete one sent
      # with the three keys and no number; its hollow pin, its band, its tags;
      # an editor locked out of establishing one and told, in words about
      # administrators rather than the editors list, that adding a station
      # outright is an administrator's; What is here proposing at its point;
      # and a database without 0039 not sent a proposal at all.
      - name: Proposed stations — proposed, shown for what they are, established by an administrator
        working-directory: test
        run: npm run proposed

      # The station history (0056, station-history.js) on the card and the
      # Admin tab, against a stand-in for the database that writes a change row
      # on a save the way the trigger does (tools/check_station_history.sql
      # holds the real one): an editor sees who changed what and when, newest
      # first, and a field, an earlier version or a deleted station goes back
      # through save_station() or restore_station() and nothing else — the
      # hub, which that save cannot write, never offered; a refusal said in
      # words; a database without 0056 told so; and anybody but an editor
      # shown none of it.
      - name: Station history — who changed what, and the way back through the editor's own save
        working-directory: test
        run: npm run stationhistory

      # What the Stations filter box *selects*. `npm run smoke` opens the tab
      # and asserts a clean console; a search box handing back the wrong
      # stations throws nothing at all, so nothing else here can see it. The
      # windows (`4021-4025`) are the new rule; the names, bare addresses and
      # pasted lists asserted beside them are the old ones, so that "additive"
      # is something the harness holds rather than a word in a commit message.
      - name: Search — an address window selects the stations inside it
        working-directory: test
        run: npm run search

      # What the link budget card does with its two ends, and what it refuses to
      # do with them. Every failure here is a clean console: a search box that
      # hands back the wrong stations, a box that loses the caret on the third
      # keystroke, a repaint that discards a half-typed TX power, a pin click
      # that never reaches the card at all (it did not — the markers are built
      # with `bubblingMouseEvents: false`), and a budget over a zero-length path
      # reporting +155 dB and the word "Good".
      - name: Link budget — either end, found and armed; and what it refuses
        working-directory: test
        run: npm run linkbudget

      # The profile with ground cover on it and the Longley–Rice budget over
      # it. Every other check sees these panels in their no-terrain state; this
      # one answers the tile server with flat ground it makes itself and seeds
      # the land cover, so the band on the chart, the cover terms in the budget
      # and the settings that drive the model are all exercised on the real page.
      - name: Path cover — the profile, the band, the model over it
        working-directory: test
        run: npm run pathcover

      # The profile's cursor, on the chart and on the map at once. The tiles
      # are a ramp in longitude built here — 0 m at one end of the hop, 1,000 m
      # at the other, continuous across tile boundaries — so every reading is
      # arithmetic: a quarter of the way along, the cursor has to say 250 m.
      # Driven from both sides, because it works from both.
      - name: Path cursor — the ground under the pointer, on both pictures
        working-directory: test
        run: npm run pathcursor

      # The database half of the claim is proven against a real Postgres by
      # tools/check_mqtt.sql, which CI cannot run — it needs a connection. What
      # this covers is the half that only exists in a browser: that an
      # unresolved relayed row offers the claim at all, that the picker sends
      # the ALERT2 *station address* rather than the sensor slot, that the count
      # the database returns is what gets announced, and that the form comes
      # down on the write rather than on the read after it. Two defects were
      # found writing it and neither was visible to any other check here.
      # Added here rather than with the check itself: `catchments.mjs` landed in
      # `npm run all` without a CI step, so it ran for whoever typed it and on no
      # push at all. A check CI does not run is a check that is not there.
      - name: Catchment boundaries — drawn, out of the way, and answering where a station is
        working-directory: test
        run: npm run catchments

      # The Service Level Specification on a station card. The assertion this
      # exists for is the join: the document pads bureau numbers to six digits
      # and station_number does not, so 262 of the 1,146 matches depend on the
      # padding being stripped and nothing else in CI would notice it breaking.
      - name: Service Level Specification — the flood classes reach the card they belong on
        working-directory: test
        run: npm run sls

      # The flood classes, crossings and gauge survey from the Bureau's river
      # height station lists (0031), on the card and in the editor. The
      # assertion that matters most is invisible when it breaks: a save sends
      # only the lists the form changed, because an untouched list resent
      # through the browser's parse would come back with 94.50 as 94.5.
      - name: River height station details — the card says what holds now, a save sends what changed
        working-directory: test
        run: npm run riverdetails

      # The AEP flood levels (0032) and the indicative flood velocity worked out
      # from them. The arithmetic is checked against hand-worked figures off
      # the page, and the card's velocity against the module's own — the two
      # places a number could quietly be wrong without anything looking broken.
      - name: AEP flood levels — indicative levels on the card, a velocity that is the arithmetic's
        working-directory: test
        run: npm run floodlevels

      # A station's RX/TX pairs beyond a repeater's own (0032): the primary pair
      # stays where every path tool reads it, and a save sends exactly the rows
      # that were typed.
      - name: Frequencies — rows on repeaters and base stations, a save sends what was typed
        working-directory: test
        run: npm run frequencies

      # The site exposure section on the station card (site-exposure.js): tidal
      # water, the Water Act's downstream limits, the coastal hazard areas and
      # acid sulfate soils, from the Queensland Government's map services, which
      # the check answers itself layer by layer. The assertion it exists for is
      # invisible when it breaks: a source that did not answer is named as such,
      # never shown as "none", and a station outside Queensland is told so.
      - name: Site exposure — tides and soils on the card, a failed source named and never read as "none"
        working-directory: test
        run: npm run exposure

      # The land section on the station card and the What is here card
      # (site-land.js): the lot, its tenure, who holds that kind of land and the
      # council, from the Queensland cadastre, which the check answers itself.
      # The assertions it exists for: freehold never says who owns it (the State
      # does not publish owners), a failed source is never read as "none", and
      # the DCDB's New South Wales pseudo-parcel is never read as a lot.
      - name: Land — tenure and council on the cards, never an owner guessed or a failure read as "none"
        working-directory: test
        run: npm run land

      - name: Claim an address from the message that arrived on it
        working-directory: test
        run: npm run claim

      # A level charted as rain, with a 0.2 mm/tip conversion offered against
      # metres — because the field path could not resolve a `s:<number>/<channel>`
      # address to its sensor row, and guessKind's fallback is RainAccum. Smoke
      # cannot see this: the tab renders, the axis is drawn, nothing throws, and
      # the chart is simply wrong about what it is charting.
      - name: Field series kind — a level is a level, and is offered no bucket size
        working-directory: test
        run: npm run fieldkind

      # The picker offered a station's sensors out of stations.json and nothing
      # else, which for 18 Bateson is an empty list beside four channels
      # reporting every five minutes under another station row. This check is
      # the path between them, and the two refusals that keep it honest: a
      # widened match is never charted on its own, and a series is labelled with
      # the station its readings are filed under rather than the one the picker
      # was showing. Invisible to smoke — the picker draws either way.
      - name: What the datastore holds — the Field Data probe, and whose readings they are
        working-directory: test
        run: npm run fieldprobe

      # The same drift the claim step's note describes, found again while
      # adding the one above: `mapfade` has been in `npm run all` with no step
      # here, so it has run for whoever typed it and on no push at all. A check
      # CI does not run is a check that is not there. The two lists were kept
      # in step by hand until #183; `npm run steps`, near the top of this job,
      # holds them together now — the check both these notes said was worth
      # writing.
      - name: Fade margin — the figure the map colours a link by is the card's own
        working-directory: test
        run: npm run mapfade

      # What the links say and where the map's furniture sits (#186). Nine
      # changes landed together and `smoke` is blind to every one of them: a map
      # whose links are all one colour, whose arrows never draw, whose credit
      # line covers the move-pin panel's Save button, whose Clear buttons leave
      # the map three-quarters faded and whose Map display search hides nothing
      # all open with a clean console. The panel filtering is measured with
      # getClientRects() rather than off `el.hidden`, because the first
      # implementation set the attribute and left every row on screen — an
      # author `display: flex` beats the browser's own `[hidden]` rule, and a
      # check reading the property would have agreed with the bug.
      - name: Map links — the colour, the arrows, the credit line and the split
        working-directory: test
        run: npm run maplinks

      # The side panel (#help-panel, the dock): the help, the Stations cards and
      # any map panel pinned into it, in one resizable, tabbed column. Every
      # check above sees one piece of it — `shell` the landmark and the ❔
      # toggle, `help` the prose, `maplinks` the map beside the cards — and none
      # sees the seams: a card left behind in the panel when the tab goes (two
      # copies of one id, and getElementById painting the stale one), a pinned
      # panel that does not come back after its map is rebuilt, a width handle
      # that drags and is not re-measured, full screen burying a pinned panel.
      # Real pointers on the handle and the pins; ids counted document-wide.
      - name: Side panel — tabbed, resizable, and nothing left behind
        working-directory: test
        run: npm run dock

      # The drawing leaving for Google Earth (#183). Nothing else here can see
      # a KML at all: `smoke` presses the button and never opens the file, and
      # a wrong one opens perfectly — Google Earth ignores a `<styleUrl>`
      # naming a style that is not there, and draws lat,lon coordinates in the
      # Indian Ocean without complaint. This parses the document and measures
      # the ground it describes: the axis order, a circle that is round on the
      # sphere rather than on the screen, and the station list checked against
      # a haversine that is not the app's.
      - name: Drawing KML — the shapes, the stations, and the right planet
        working-directory: test
        run: npm run drawkml

      # The five terrain-and-place features (#184), against a world this check
      # makes: terrarium tiles generated per tile coordinate from a closed form,
      # so the summits the peak finder returns, the colours the elevation base
      # paints and the coverage the polar plot computes are all checkable
      # against arithmetic rather than against whatever SRTM says today. Three
      # of the five are meaningless over `pathcover`'s one flat tile, which is
      # why this has a fixture of its own.
      - name: Terrain kit — the ramp, the peaks, the plot, the coordinate, the margin
        working-directory: test
        run: npm run terrain

      # The repeater site finder (map-sites.js), on the terrain kit's hilly
      # world, seeded land cover and a stubbed Queensland cadastre: the paste
      # exact before loose, summits rather than hillsides, results spaced, the
      # quoted margin the link budget card's own arithmetic, a weight a re-rank
      # rather than a re-run, the road asked only when it is wanted, the circle
      # armed and landed with a real pointer, and reset taking all of it away.
      - name: Repeater site finder — sites in, three to five places out
        working-directory: test
        run: npm run sites

      # The 3-D view (map-3d.js). Invisible to every check above it: `smoke`
      # opens the Stations tab and a ⛰️ button that does nothing at all passes,
      # `registry` looks for Leaflet maps and a WebGL context outliving its div
      # is not one, and `maplinks` measures the 2-D links while a 3-D view
      # drawing a different set in different colours leaves it green. Needs
      # WebGL2, which Playwright's Chromium has through SwiftShader; the check
      # skips rather than fails if it is ever absent.
      - name: The 3-D view — the mirror, the sheet geometry, the teardown
        working-directory: test
        run: npm run map3d

      # The Digital Twin tab (digital-twin.js). `smoke` opens it and, with
      # every elevation host blocked, a tab that says "no ground could be
      # read" passes; `tabs` measures its panels in that same state. What is
      # asserted here is the scene: the State's GeoTIFF read into the mesh
      # with each pixel centre on its vertex, the 2 m × 300 mm pole standing
      # on the ground at the origin and the 1.75 m figure on the ground
      # beside it, the imagery draped, the .glb round-tripping, the fallbacks
      # (empty raster → the tiles, blank imagery → Esri, a raster that came
      # back a different shape → refused), walk mode at eye height, the
      # renderer going with the tab, and then the twin inside the Stations
      # map — the hand-over at zoom 17, the map's own link lines mirrored as
      # rays in the map's colours, the wheel-out back to the map. Needs
      # WebGL2 through SwiftShader, like map3d; skips rather than fails
      # without it.
      - name: The Digital Twin — the ground, the pole and the figure on it, the .glb, the teardown
        working-directory: test
        run: npm run twin

      # Field photos (photo-meta.js, field-photos.js, map-photos.js and the
      # twin's markers). `smoke` opens the tab signed out, where it says "sign
      # in" and nothing else. This signs in against a fake project and drops
      # eight files: the two Solocator photos read by the real OCR engine
      # (served from the harness, like three.js), one placed from its EXIF,
      # a duplicate, a HEIC, two with no position anywhere and a text file —
      # then the upload's order and records, the same photo refused three
      # ways with its bytes taken back down, the library, the carousel by
      # keyboard, Dropbox's PKCE link end to end, the map's pins and cones,
      # and the twin's markers on the ground, clicked and walked up to. The
      # reader and the overlay parser are held first, under Node, against
      # files built byte by byte. The twin half needs WebGL2 and skips
      # without it; tools/check_field_photos.sql holds 0035's own rules.
      - name: Field photos — read, placed, uploaded, and shown on the tab, the map and the twin
        working-directory: test
        run: npm run photos

      # Zip packs on the Field Photos tab (photo-zip.js). `photos` never drops a
      # zip, and everything a zip can do wrong is quiet: wrong bytes still
      # decode, a wrong code page is a wrong title, a zip that lies about its
      # size runs a phone out of memory. The reader is held under Node against
      # zips built byte by byte, every refusal with its sentence; then a zip
      # dropped with loose photos goes in exactly as they do.
      - name: Zip packs — a zip of photos opens in the browser, and its photos go in as photos
        working-directory: test
        run: npm run photozip

      # The Review panel and equipment labels (photo-review.js,
      # photo-equipment.js, 0036): what became of every upload, and the
      # make, model and serial a label reads as, proposed and waiting for an
      # administrator. The parser under Node against clean and garbled OCR,
      # then the panel against a fake project and the real OCR engine — an
      # editor who may not decide, and an administrator who corrects,
      # approves and rejects. tools/check_photo_review.sql holds 0036's rules.
      - name: Review — what came in, and what the labels say, waiting for an administrator
        working-directory: test
        run: npm run photoreview

      # The twin's flood water (flood-stages.js and its drawing in
      # digital-twin.js). `twin` holds the ground the water stands on and says
      # nothing about where the water goes: a class hung from an assumed
      # datum, a hollow behind a bank that fills because it is low rather than
      # because the river reaches it, a colour that goes back from magenta to
      # red past a major class set above the 1% AEP — each is a twin that
      # draws, with a clean console. The ladder, colours and cycle are held
      # first under Node against real station records; then the real Gatton
      # levels are stood on a valley the check makes (a channel, a floodplain,
      # a hollow inside a bank), so where the water should be is arithmetic.
      # The rise is read against its own clock, not the wall's: SwiftShader
      # draws a handful of frames a second. Skips without WebGL2, like twin.
      - name: Flood water in the twin — the levels, where the water goes, the rise and its off switch
        working-directory: test
        run: npm run flood

      # The twin's site, as built from the record (digital-twin.js, map-twin.js).
      # `twin` holds the ground and the hand-over's mechanics and `flood` the
      # water; everything here draws a scene that looks right when it is
      # wrong — a manual gauge drawn as a Type 3 pole, a bridge deck at the
      # height of the creek bed, a neighbour floating over its ground, levels
      # borrowed from a station that is not the nearest without a word. So the
      # manual collector, the staff gauge and the red post are measured off the
      # scene, the neighbours stood on a valley the check makes, the bridge
      # deck put at Gatton's listed crossing (3.90 m on a zero of 87.54 m AHD:
      # 91.44 m) and at its banks without one, the four nearest donors offered
      # and one borrowed and given back; then the lines over the stage folding
      # after their delay, and the map offering the twin at zoom 17 rather than
      # handing itself over. Skips without WebGL2, like twin.
      - name: The twin's site — the station as built, its neighbours, the bridge, borrowed levels, the offer
        working-directory: test
        run: npm run twinsite

      # Moving a station's pin where the ground can be seen: the twin's own
      # tab, the twin inside the Stations map, and ⛰️ 3-D. `movepin` drives the
      # mode on the flat map; everywhere else it used to arm with its pin under
      # a WebGL canvas — out of sight and out of reach — and, in 3-D, move it
      # to the flat map's coordinate for a pixel on a tilted view. So the pin
      # is asserted in each renderer: dragged with a real pointer, clicked into
      # place, read back to the centimetre, and saved as the database's current
      # copy of the station with only its position changed. Skips without WebGL2.
      - name: Move pin in the twin and in 3-D — the pin on the ground, the coordinate each view hands back
        working-directory: test
        run: npm run twinpin

      # The Queensland cadastre on the twin's ground (twin-cadastre.js): lot
      # boundaries with their lot and plan, the road reserve outlined and
      # named. Every way it goes wrong draws a plausible picture — a line on
      # the bilinear surface instead of the triangles, a line exactly on the
      # ground and so under the 10 cm drape round the station, the reserve cut
      # into blocks at its own internal edges, a strata plan on the ground,
      # "the road reserve of Road". So the geometry is held under Node, then a
      # neighbourhood is laid over a curved valley with the stub honouring the
      # query's `where`: every line on the mesh by a ray, the outline rules by
      # segment, the words, the labels, and the boundary over the drape read
      # off two screenshots. Skips without WebGL2, like twin.
      - name: The cadastre in the twin — lot boundaries and numbers, the road reserve, on the ground exactly
        working-directory: test
        run: npm run twincadastre

      # The two navigators under and beside the Arrow chart. Their edge handles
      # were ungrabbable for a reason no check here could see: the drawing and
      # the hit-test each converted client coordinates to viewBox coordinates
      # their own way, and disagreed by 12–17 px, so the handle was painted in
      # one place and every press was measured in another. `smoke` sees a chart
      # that renders; only a real press at the handle's drawn position tells the
      # two apart. Also the wheel, which shares that mapping, and the deltas the
      # pinned callout quotes either side of a reading.
      - name: Arrow navigators — the handles, the wheel and the callout's deltas
        working-directory: test
        run: npm run adnav

      # The Data Quality codes an export arrives with. The tab read them from the
      # first import — table, callout, both export CSVs, editable by hand — and
      # `runFilter()` looked at the timestamps and the values and nothing else,
      # so a reading the telemetry itself had flagged was filtered exactly as
      # though it had not been. Nothing throws and every other check here is
      # green while it is true; the chart is simply wrong about what survived.
      - name: Arrow quality codes — the exporting system's verdict decides something
        working-directory: test
        run: npm run adqual

      # A station's flood classes and AEP levels as lines across a level series
      # on the ARRO Data and Field Data charts (#226). The classes are metres on
      # the gauge, the AEP levels metres AHD, and a series is one or the other:
      # every way this goes wrong draws a tidy, labelled line in the wrong
      # place — carried across the gauge zero the wrong way, not at all, or
      # through a zero on an assumed datum. So the arithmetic is held under
      # Node against real records, and in Chromium each line is read back
      # against the height the chart's own axis gives its figure, the ones that
      # cannot be placed are asserted absent, and the PNG export is decoded and
      # read pixel by pixel for them.
      - name: Flood lines on the Arrow chart — each in the series' datum, and in the PNG
        working-directory: test
        run: npm run floodlines

      # A coordinate pasted into a latitude or longitude box (places.js). A pair
      # in either box splits across both; DMS or a hemisphere letter is
      # converted to decimal degrees. A paste handler that stops matching the
      # boxes throws nothing — the pair just lands whole in one box.
      - name: Coordinate paste — a pair splits across the lat and lon boxes
        working-directory: test
        run: npm run coordpaste

      # The AR station finder (station-ar.js), 🔭 in the Stations side panel.
      # Nothing above opens it — the view waits for a press, and wants a camera,
      # a GPS and a compass — and everything it shows is arithmetic nobody can
      # see go wrong: a heading 11° out still draws a tidy row of pins. The World
      # Magnetic Model against NOAA's own test values, the phone's attitude from
      # poses built by hand, the directions against a haversine that is not the
      # app's; then on a phone (Chromium's fake camera, a set GPS fix, compass
      # readings dispatched, Android's and an iPhone's) and a desktop: the pins
      # on the screen exactly the directions in view, a tap to a station's sheet,
      # the slider and the types, and the camera, the GPS and the compass all
      # let go when it shuts.
      - name: AR station finder — true north, the directions, the pins, and nothing left running
        working-directory: test
        run: npm run ar

      # The only check here that guards a *server-side* door. worker/index.js
      # turns a Cloudflare Access token into a Supabase session, so its verifier
      # is what stands between the front gate and a token that can write. Each
      # way past it — forged signature, another application's token, expired,
      # `alg: none` — fails silently if the verifier is wrong: the app signs in
      # and works, which is the problem. Keys are generated in-process, so this
      # needs no network and no real team (#173).
      - name: The gate's door check — the Access verifier refuses what it must
        working-directory: test
        run: npm run gate

      # The other server-side door, and the one that carries the traffic.
      # worker/index.js forwards /api/db/* to Supabase so the browser never names
      # a hostname the Bureau's filter has not categorised — a route with no
      # Access identity and no secret in front of it. Both of its checks fail
      # open and in silence: a path rule that is too generous still serves the
      # app perfectly while also carrying a request that should not have left the
      # origin, and a header allow-list that leaks the Access cookie breaks
      # nothing anyone would see. Offline, no network.
      - name: The database proxy carries only what it should, and strips the rest
        working-directory: test
        run: npm run dbproxy

      # Another server-side door: /api/photos (worker/photos.js), the field
      # photos' bytes in R2. Who may put, sign and delete, which paths exist,
      # and whether a view URL was signed here and is in date — each fails open
      # and in silence if wrong, because the app works either way. Offline: R2
      # is a Map and the project's answers are a stand-in.
      - name: The photo store admits editors and signed URLs, and nothing else
        working-directory: test
        run: npm run photostore

      # And /api/briefing (worker/briefing.js): Station Health's Ask Claude on
      # Flood-Net's own Anthropic key, the one server-side door that spends
      # money. Who may (Access and the database's word that this is an editor
      # or an administrator), what it may be spent on (the briefing's request
      # and nothing else), and the day's ceiling all fail in silence — a
      # briefing still arrives — so each is asserted here, with the real SDK
      # the page pins driving the page's own request through the route.
      # Offline: Anthropic, Access's keys and the database are stand-ins, the
      # ledger the real Durable Object class over a Map.
      - name: Ask Claude on Flood-Net's key — editors only, the briefing only, a ceiling on the day
        working-directory: test
        run: npm run briefing

      # The third server-side door: /api/v1 and /api/mcp (worker/api.js), public
      # and read-only, for AI agents and scripts. What it must never do fails in
      # silence — forward a caller's token, read a private relation, write
      # anything, stop holding a limit — so each is asserted against a strict
      # in-memory PostgREST built from stations.json. Offline, no network.
      - name: The agent API reads only public relations, and holds its limits
        working-directory: test
        run: npm run agentapi

      # Five agent instruction files quote the API's URLs and limits, because
      # each agent reads only its own; this holds them, docs/agent-api.md and
      # wrangler.toml's [[ratelimits]] to what worker/api.js does.
      - name: The agent docs say what the agent API does
        working-directory: test
        run: npm run agentdocs

      # Python, no browser, no dependencies, and the only check in this file
      # that is about a *data* artefact rather than about the app: #123's sheet
      # manifest, field map and layout table are derived from the historical
      # workbook, and a derived file that nobody re-derives is a file that
      # quietly stops being true. This re-runs the survey and diffs.
      - name: Inspection workbook survey — the artefacts still match the workbook
        run: python3 tools/ingest/survey.py --check

      # #124's extract, on the same footing and for the same reason. The check
      # is not only "the files still match": the run reconciles against the
      # survey's counts and fails if a row or a cell goes missing between the
      # workbook and the staging files, so a rule that quietly stops matching
      # shows up here rather than in the load.
      - name: Inspection extract — the staging rows still reconcile
        run: python3 tools/ingest/extract.py --check

      # #125's crosswalk is derived from the extract *and* from stations.json,
      # so it is the one artefact here that a change to the registry can
      # invalidate. The weekly snapshot re-derives it in its own pull request;
      # this check is what makes a hand edit to either side re-derive it too.
      - name: Station crosswalk — the identities still resolve
        run: python3 tools/ingest/crosswalk.py --check

      # #127's derived events, on the same footing: events.jsonl is what the
      # rules derive from the extraction, coverage is a counted claim (every
      # remark classified, observed or unclassified — no silent skips), and a
      # rule edit that changes the reading re-derives the artefact or fails
      # here.
      - name: Remarks mining — the derived events still match the rules
        run: python3 tools/ingest/remarks.py --check

      # The Elvis parser, offline. The service returns everything as prose with
      # the unit stuck on, and answers "No Data" — HTTP 200, all five fields —
      # both for places it holds nothing and, under load, for places it does.
      # Parsed loosely either becomes a float in a dataset, so the parsing has
      # its own check rather than riding on a run that needs the network.
      - name: Elvis station elevations — the parsing, including "No Data" and 0 m
        run: python3 tools/elvis_station_elevations.py --check

      # The SLS extraction, on the same footing as the three above: data/
      # sls-qld.json, sls-nsw.json and sls-locations.json are derived from two
      # PDFs in archive/, and a derived file nobody re-derives quietly stops
      # being true.
      # Needs pdfplumber, which is the only dependency in tools/ — installed
      # here rather than pinned into the repo, because it is read once per SLS
      # revision and never by the app.
      - name: Install pdfplumber for the SLS check
        run: pip install --quiet pdfplumber
      - name: Service Level Specification — the extraction still matches the document
        run: python3 tools/ingest/sls.py --check

      # The Bureau's flood warning station lists, on the same footing: data/
      # river-height-stations.json is derived from nine documents in archive/ —
      # fixed-width reports whose long names carry on onto the next line, two
      # tab-aligned ones and an HTML page — and the readers that put them back
      # together are the part worth re-running. Standard library only.
      - name: River height station lists — the extraction still matches the reports
        run: python3 tools/ingest/river_height_stations.py --check

      # The AEP flood level sheets (0032), on the same footing: data/aep-levels
      # .json is read out of two workbooks in archive/ and carries a slope
      # worked out between stations, which is the part worth re-running.
      - name: AEP flood levels — the extraction still matches the sheets
        run: python3 tools/ingest/aep_levels.py --check

      # HDB's peak flood heights (0037), on the same footing: data/flood-peaks
      # .json is read out of a 3.9 MB extract in archive/ whose rows are tab-
      # aligned only nearly — a site letter missing here, a source two tabs
      # over there — and the reader that tells a row from a header is the part
      # worth re-running.
      - name: HDB flood peaks — the extraction still matches the extract
        run: python3 tools/ingest/flood_peaks.py --check

# concat-verify.mjs is deliberately not run here. It compares the app's bytes
# against a recorded snapshot, so any honest change to app.js makes it stale —
# as a per-push gate it would train everyone to re-record the baseline without
# reading it. It is a milestone tool for the #129 split; see test/README.md.

  # ── The bridge's tests (#102) ─────────────────────────────────────────────
  # 45 tests, in-process broker, no database and no network — they were green
  # and run by nobody: no workflow watched bridge/** at all, so a push
  # touching the bridge shipped untested. Now it cannot.
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Install the bridge
        working-directory: bridge
        run: npm ci
      - name: Bridge tests
        working-directory: bridge
        run: npm test

  # ── The photo syncs' tests: Dropbox (0035) and Google Drive (0036) ────────
  # The sync runs on a schedule with a secret key that can write where only
  # editors may, and everything it does wrong is silent: a photo filed in the
  # wrong place, the same one twice, a removed one brought back, a cursor that
  # skips a folder's worth. So it is run here against a fake Dropbox, a fake
  # Google Drive and a fake project, with the real photo-meta.js and the real
  # OCR engine reading the two Solocator fixtures, and zips of them opened by
  # the sync's own reader — offline, as the bridge's are.
  field-photos-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/field-photos/package-lock.json
      - name: Install the sync
        working-directory: tools/field-photos
        run: npm ci
      - name: The sync, against a fake Dropbox, a fake Google Drive and a fake project
        working-directory: tools/field-photos
        run: npm test

  # ── The database checks, against a real Postgres (#102) ──────────────────
  # tools/check_*.sql were built to run in a workflow — a row per check,
  # non-zero on failure — and nothing ran them: they need a database, and no
  # job had one. This one does: a fresh Postgres 16, the Supabase-shaped
  # scaffold (tools/ci/pg_scaffold.sql), every migration in order, the real
  # stations.json — the exact recipe #146/#149/#159 proved by hand. The two
  # load-dependent suites report `skip` rows here rather than failing, which
  # is their own honest design; what this job proves on every push is that
  # the migration chain applies from zero and every shape/permission claim
  # holds. check_attachments.sql stays by-hand: it exercises the Supabase
  # storage surface the scaffold only sketches.
  db-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: meganet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: meganet
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Scaffold the Supabase-shaped surface
        run: psql -v ON_ERROR_STOP=1 -q -f tools/ci/pg_scaffold.sql
      - name: Apply every migration, in order, from zero
        run: |
          for f in db/migrations/0*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 --single-transaction -q -f "$f"
          done
      # The two private buckets and their eight policies (0010, 0035). Not a
      # migration — storage is Supabase's schema — and until the scaffold grew
      # the buckets table's limit columns this file had only ever been run by
      # hand, so the verdict at its foot (the half #145 got wrong) was checked
      # nowhere. Twice, because it claims to be safe to re-run.
      - name: The storage buckets — private, four policies each, and re-runnable
        run: |
          psql -v ON_ERROR_STOP=1 -q -f tools/storage_bucket.sql
          psql -v ON_ERROR_STOP=1 -q -f tools/storage_bucket.sql
      - name: Load stations.json
        run: python3 tools/import_stations_json.py | psql -v ON_ERROR_STOP=1 --single-transaction -q
      - name: check_ingest.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_ingest.sql
      - name: check_mqtt.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_mqtt.sql
      # The receivers behind an ingest token (0045): token-checked, refusing a
      # bad report by name, a change a new row and a repeat not, editors only —
      # and nothing but a GPS fix ever stored as an exact location.
      - name: check_ingest_points.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_ingest_points.sql
      # Ingest tokens from the Admin tab (0046): administrators only, a token
      # shown once and kept as its hash, labels unique among live tokens, and a
      # revoke that shuts the door at once.
      - name: check_ingest_token_admin.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_ingest_token_admin.sql
      # Receptions (0047): every frame a receiver heard, good or bad, kept —
      # token-checked, a retry stored once, editors only, GPS the only exact.
      - name: check_receptions.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_receptions.sql
      # A reading's frequency and signal (0050): stored from the reading or
      # its envelope, readable by anon like the rest of it, the first copy's
      # kept on a duplicate — and a bad one stored as null, never a refusal.
      - name: check_reading_signal.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_reading_signal.sql
      # The newest reading of every address (0057), which the agent API's
      # /api/v1/readings/latest reads: one row per address, by the device's
      # own time and the later received of a tie, agreeing with DISTINCT ON —
      # and read by anon exactly as an editor reads it.
      - name: check_reading_latest.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_reading_latest.sql
      # A base station asking for its token (0048): anon may ask, only the hash
      # of the device's own token is kept, only an administrator approves —
      # and the approved token opens the door with nothing to collect.
      - name: check_ingest_token_requests.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_ingest_token_requests.sql
      # Base stations checking in (0049): token-checked check-ins, a fixed list
      # of requests handed over once and expired after ten minutes, settings
      # kept away from the token and the station's own remote settings, a
      # station that only reports refused, and the team keys — public keys,
      # fingerprinted as ssh-keygen prints them, fetched only with a live token.
      - name: check_base_stations.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_base_stations.sql
      # The network's health kept by the database (0059): a base station that
      # stops checking in and a receiver that runs but decodes nothing each a
      # finding on the next run, held while its station is away, cleared when
      # it recovers; the station analysis' reports opened, updated, refused
      # when stale and cleared only when complete; a base station's findings
      # for administrators only.
      - name: check_health_findings.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_health_findings.sql
      - name: check_inspections.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_inspections.sql
      - name: check_inspection_history.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_inspection_history.sql
      - name: check_river_height_details.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_river_height_details.sql
      - name: check_bureau_station_lists.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_bureau_station_lists.sql
      # The SQL river_height_stations.py prints is what writes the Bureau's lists
      # into the live database, and nothing else ever runs it — so a migration
      # that renames a column it writes would be found the next time somebody
      # fed it a new edition. Run here against the database stations.json just
      # built, in a transaction that rolls back.
      - name: The Bureau lists' SQL still fits the schema
        run: |
          { echo 'begin;'; python3 tools/ingest/river_height_stations.py --sql; echo 'rollback;'; } \
            | psql -v ON_ERROR_STOP=1 -q
      - name: check_aep_levels_and_frequencies.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_aep_levels_and_frequencies.sql
      # The field photo door (0035): the path and type rules a private bucket's
      # privacy rests on, one live photo per SHA-256, one row per Dropbox file
      # (tombstones included, so a removed photo stays removed), the nearest
      # station within a kilometre, and who may read what — signed in as an
      # editor, as a stranger, as anon and as the sync's service_role.
      - name: check_field_photos.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_field_photos.sql
      # The upload log, the administrator and the equipment register (0036):
      # an outcome per file from every way in, is_admin() for exactly the
      # people it names, and a suggestion that reaches the register only
      # through an administrator's decision — signed up through 0005's own
      # triggers as an administrator, an editor and a stranger.
      - name: check_photo_review.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_photo_review.sql
      # Proposed stations (0039): what a proposal has to say, the station
      # document gaining nothing for a station that is not one, and who may
      # propose, add outright and establish — signed up through 0005's own
      # triggers as an editor and an administrator — with the whole register
      # back through load_stations_doc() carrying a proposal.
      - name: check_proposed_stations.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_proposed_stations.sql
      # A tower's platform height (0040): 3.0 or 4.5 m and nothing else, the
      # document gaining nothing until one is recorded, and only an editor
      # recording it — through save_station() and load_stations_doc() alike.
      - name: check_tower_height.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_tower_height.sql
      - name: check_station_facing.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_station_facing.sql
      # The station history (0056): a change to a station's own fields
      # recorded once, with only what moved, and nothing for a save or a sync
      # that changes nothing — the whole register back through
      # load_stations_doc() included; whom each change is pinned on; editors
      # alone reading it; and the way back, a field through save_station() and
      # a deleted station through restore_station(), each refused in words
      # where an ordinary save would be.
      - name: check_station_history.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_station_history.sql
      # The Admin tab's user management (0042): administrators only, the role
      # a first sign-in arrives with, and the guards against locking everybody out.
      - name: check_user_admin.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_user_admin.sql
      # The Admin tab's dashboard (0043): administrators only, and the visit
      # log's anonymous write held to one row a visitor a day, 5,000 a day.
      - name: check_admin_dashboard.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_admin_dashboard.sql
      # …and the same for the AEP sheets' SQL (0033): it attaches rows by
      # number and by position into columns only it and the editor write.
      - name: The AEP levels' SQL still fits the schema
        run: |
          { echo 'begin;'; python3 tools/ingest/aep_levels.py --sql; echo 'rollback;'; } \
            | psql -v ON_ERROR_STOP=1 -q
      # HDB's peak flood heights (0037), loaded for real — 61,039 rows, the way
      # load_flood_peaks_from_url() loads them live — and then held to the
      # rules: each peak through the zero of its day or left off with a reason,
      # the five a station keeps, and the triggers that keep them current
      # through a survey edit, a renumbering and a save from the editor. The
      # check runs without the load too (it says `skip`), but only with it
      # does it read the real Gatton, Ipswich and Little Nerang Dam.
      - name: Load the HDB flood peaks
        run: python3 tools/ingest/flood_peaks.py --sql | psql -v ON_ERROR_STOP=1 --single-transaction -q
      - name: check_flood_peaks.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_flood_peaks.sql
      # A station taking its flood history from another (0041): Gatton's floods
      # on a station beside it, through Gatton's zero, following Gatton's changes,
      # and a gauge of its own winning — after the peaks are loaded, above.
      - name: check_flood_peaks_from.sql
        run: psql -v ON_ERROR_STOP=1 -f tools/check_flood_peaks_from.sql
      # The SLS's merge rule is written twice — in tools/ingest/sls.py for the
      # file the app reads off disk, and in meganet.sls_location for anything
      # that asks the database — and this is what holds the two to one rule:
      # data/sls-qld.json and data/sls-nsw.json loaded in a transaction that
      # rolls back, the view read, and every location compared with
      # data/sls-locations.json, field by field. It also proves a new edition's
      # rows load into the schema, and that one document's load leaves the
      # other's rows alone.
      - name: The SLS loads, and the database merges it as the app's file does
        run: python3 tools/check_sls_merge.py
