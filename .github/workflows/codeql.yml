# CodeQL: GitHub's own static analysis, free for a public repository. It reads
# the code for known-dangerous patterns (DOM XSS, injection, unsafe regexes,
# workflow script injection) and files what it finds under Security → Code
# scanning, where only people with write access see the detail.
#
# This is the cheap, deterministic half of the security net. The other half is
# the weekly Claude review in tools/security-scan/, which looks for what a
# pattern matcher cannot — the agent API ceasing to be read-only, a Supabase
# grant wider than db/README.md says, private data reaching a public file.
#
# It runs weekly and on a push that touches code, not on every data refresh.
# No build step: JavaScript, Python and the workflows themselves are all read
# as source.

name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '**.js'
      - '**.mjs'
      - '**.py'
      - '**.html'
      - '.github/workflows/**'
  schedule:
    - cron: '17 19 * * 0'   # Monday 05:17 in Brisbane
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
