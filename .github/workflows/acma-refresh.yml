# Weekly refresh of the ACMA RRL interference layer, committed straight to main.
#
# WHY WEEKLY, NOT MONTHLY. ACMA republishes the Register of Radiocommunications
# Licences extract daily (~6am AEST) and keeps no back-catalogue: a month that
# is not captured can never be recovered. The old monthly job lost August and
# September 2026 that way — the download worked both times, but the step that
# opened a pull request was refused ("GitHub Actions is not permitted to create
# or approve pull requests"), so nothing was saved; October's run did open a
# PR (#208), which then sat unmerged, so the app kept July's data for three
# months. Weekly fixes both failure modes at almost no cost:
#   * every month gets four or five chances to be captured, so one failed run
#     (ACMA outage, a renamed download URL) no longer costs a month;
#   * acma_diff.py --archive re-archives the current month with each newer
#     extract, so data/acma-raw/<YYYY-MM>/ ends up holding the month's latest
#     extract and month-to-month diffs stay what they were;
#   * a new mast near a repeater shows up in Flood-Net within a week of ACMA
#     registering it, which is what an interference investigation needs.
# Daily would add commits without adding information: register changes near
# Flood-Net repeaters run at a handful a month.
#
# WHY STRAIGHT TO MAIN. CLAUDE.md: patches go to main, no PRs. A data PR nobody
# merges is worse than no refresh at all, because it looks like there is one.
# The swing in threat counts that the PR used to surface is printed in this
# job's summary instead, and a commit only happens when the data changed.
#
# SAFETY. The job refuses to commit an extract that has lost more than 30% of
# the devices of the last committed subset — a truncated download, or ACMA
# changing the extract's layout, fails the run (GitHub emails the owner)
# instead of quietly emptying the layer.
#
# If the download step starts failing: ACMA retired the legacy web.acma.gov.au
# host in October 2026. Find the new bulk "Radiocomms licence data" download
# link on acma.gov.au and put it first in ACMA_ZIP_URLS below. As a stopgap, the extract can also be attached to a
# GitHub Release (see the acma-data-* tags) and the URL pointed there.
#
# Pushes made with GITHUB_TOKEN start no other workflow, and data/acma-* is
# outside the web smoke test's filter anyway; data/mobile/** is inside it but,
# for the same reason, a push from here never launches it.
#
# Data licence: CC BY 4.0, attribution in README and data/acma-raw/_manifest.json.

name: Refresh ACMA RRL data

on:
  schedule:
    # 20:15 UTC Sunday = 06:15 AEST Monday, just after ACMA's daily publish
    - cron: '15 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acma-refresh
  cancel-in-progress: false

env:
  # Tried in order; the first that answers with a valid zip wins and the log
  # says which. web.acma.gov.au stopped resolving in October 2026 (ACMA moved
  # the offline register to cdn.acma.gov.au), so the CDN host comes first and
  # the legacy host stays as a fallback in case the outage was temporary. If
  # all fail, find the current link from the "Data download" tab of
  # https://www.acma.gov.au/register-radiocommunication-licences-rrl and put it
  # first here.
  ACMA_ZIP_URLS: >-
    https://cdn.acma.gov.au/rrl-updates/spectra_rrl.zip
    https://cdn.acma.gov.au/offline-rrl/spectra_rrl.zip
    https://web.acma.gov.au/rrl-updates/spectra_rrl.zip

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ACMA extract
        run: |
          # Discover the current link too: ACMA has moved this file before, so
          # any spectra_rrl*.zip linked from its register pages (or the offline
          # register's scripts) is tried after the configured URLs.
          found=$(python3 - <<'PY'
          import re, urllib.request, urllib.parse
          pages = ['https://www.acma.gov.au/register-radiocommunication-licences-rrl',
                   'https://www.acma.gov.au/radiocomms-licence-data',
                   'https://cdn.acma.gov.au/offline-rrl/index.html']
          seen, out = set(), []
          def get(u):
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 FloodNet-acma-refresh'})
                  return urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
              except Exception as e:
                  print('#', u, e); return ''
          queue = list(pages)
          while queue:
              u = queue.pop(0)
              if u in seen or len(seen) > 40: continue
              seen.add(u); html = get(u)
              for m in re.findall(r'''["'(]([^"'()\s]*spectra_rrl[^"'()\s]*\.zip)''', html, re.I):
                  z = urllib.parse.urljoin(u, m)
                  if z not in out: out.append(z)
              for m in re.findall(r'''(?:src|href)=["']([^"']+\.js)["']''', html, re.I):
                  queue.append(urllib.parse.urljoin(u, m))
          print('\n'.join(out))
          PY
          )
          echo "Discovered on ACMA pages:"; echo "$found" | grep -v '^#' || true
          for url in $ACMA_ZIP_URLS $(echo "$found" | grep -v '^#'); do
            echo "Trying $url"
            rm -f /tmp/spectra_rrl.zip
            if curl -fSL --retry 2 --retry-delay 15 \
                 -A "FloodNet-flood-telemetry-interference-check (+https://github.com/${{ github.repository }})" \
                 -o /tmp/spectra_rrl.zip "$url" \
               && python3 -c "import zipfile,sys; z=zipfile.ZipFile('/tmp/spectra_rrl.zip'); bad=z.testzip(); sys.exit('corrupt member: %s' % bad if bad else 0)"; then
              echo "Downloaded from $url"; ls -l /tmp/spectra_rrl.zip
              echo "Extract downloaded from $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::No ACMA download URL worked. Update ACMA_ZIP_URLS in this workflow."
          exit 1

      - name: Remember the last committed subset's counts
        run: cp data/acma-raw/_manifest.json /tmp/prev_manifest.json

      - name: Prefilter to Flood-Net-relevant subset
        run: python3 tools/acma_prefilter.py --zip /tmp/spectra_rrl.zip
             --stations stations.json --out data/acma-raw

      - name: Refuse a shrunken extract
        run: |
          python3 - <<'PY'
          import json, sys
          old = json.load(open('/tmp/prev_manifest.json')).get('counts', {})
          new = json.load(open('data/acma-raw/_manifest.json')).get('counts', {})
          print('devices %s -> %s, licences %s -> %s, sites %s -> %s' % (
              old.get('devices'), new.get('devices'), old.get('licences'),
              new.get('licences'), old.get('sites'), new.get('sites')))
          for k in ('devices', 'licences', 'sites'):
              o, n = old.get(k) or 0, new.get(k) or 0
              if o and n < 0.7 * o:
                  sys.exit('%s fell from %d to %d (more than 30%%): refusing to '
                           'commit this extract. Check the download and the '
                           'extract layout before re-running.' % (k, o, n))
          PY

      - name: Classify and score interference candidates
        run: python3 tools/acma_fetch.py --suggest-licences

      # Archive this month's subset under data/acma-raw/<YYYY-MM>/ (replacing an
      # earlier extract of the same month) and diff it against the previous
      # month. Archived months are kept forever, never deleted.
      - name: Archive snapshot and compute register diffs
        run: python3 tools/acma_diff.py --archive

      # Every Telstra, Optus and TPG mobile sector, off the same extract, for
      # the mobile coverage section on the station and What is here cards
      # (site-mobile.js). The ACCC's list of Optus sites shared with TPG is the
      # yearly file committed beside it, refreshed with the coverage maps by
      # coverage-tiles.yml (docs/mobile-coverage.md).
      - name: Mobile base station sectors
        run: python3 tools/mobile_sectors.py --zip /tmp/spectra_rrl.zip
             --mocn data/mobile/accc-mocn-sites.csv --out data/mobile

      - name: Summarise what changed
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open('data/acma-raw/_manifest.json'))
          t = json.load(open('data/acma-threats.json'))
          snaps = json.load(open('data/acma-snapshots.json')).get('snapshots', [])
          ch = json.load(open('data/acma-changes.json'))
          print('## ACMA refresh')
          print('Extract generated %s; %s devices, %s licences, %s sites in the Flood-Net subset.' % (
              m.get('generated', '?')[:10], m['counts'].get('devices'),
              m['counts'].get('licences'), m['counts'].get('sites')))
          print('')
          print('Anchors with threats: %d; threats in total: %d.' % (
              len(t.get('anchors', [])), sum(len(a.get('threats', [])) for a in t.get('anchors', []))))
          print('Archived months: %s' % ', '.join(s['month'] for s in snaps))
          pairs = ch.get('pairs', [])
          if pairs:
              p = pairs[-1]
              print('')
              print('Latest diff %s → %s: %d changed devices %s, %d new co-tenants, %d new IMD products on RX channels.' % (
                    p.get('from'), p.get('to'), len(p.get('changes', [])), json.dumps(p.get('counts') or {}),
                    p.get('cotenants') or 0, len(p.get('new_imd', []))))
          PY
          cat "$GITHUB_STEP_SUMMARY"

      - name: Commit to main if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/acma-raw data/acma-*.json data/acma-licence-suggestions.csv data/mobile
          if git diff --cached --quiet; then
            echo "No change in the register near Flood-Net since the last refresh — nothing to commit."
            exit 0
          fi
          git commit -m "Refresh ACMA RRL data (weekly, extract $(python3 -c "import json;print(json.load(open('data/acma-raw/_manifest.json'))['generated'][:10])"))" \
                     -m "Contains ACMA Register of Radiocommunications Licences data, CC BY 4.0."
          for attempt in 1 2; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $attempt); retrying after rebase."
            sleep 10
          done
          exit 1
