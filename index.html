<body>

  <!-- First focusable thing on the page, and invisible until it is focused
       (#109). The nav is twenty buttons and a find box: without this, a
       keyboard user arriving at Flood-Net had twenty-two stops to make before
       reaching the first control on the tab they came for, on every single
       page load. focusMain() rather than the href alone — a fragment jump
       scrolls the page but leaves focus at the top of the document in several
       browsers, which is the half of the problem that actually matters. -->
  <a class="skip-link" href="#main-content" onclick="focusMain(event)">Skip to main content</a>

  <!-- The app's one live region (#109). Polite, always; core.js's announce() is
       the only thing that writes to it, and the four rules for what may be
       announced are written above that function. It is here rather than inside
       any tab because a region that is removed from the DOM and re-added
       announces nothing — it has to have been present, and observed, before
       the text lands in it. -->
  <p id="app-status" class="sr-only" role="status" aria-live="polite"></p>

  <!-- Every header button is icon + label. Once the window is narrow enough that
       the labels would wrap the banner onto a second row, styles.css hides them
       and the icons stand alone — which is what folds three rows into one.
       Anything that rewrites a label from app.js writes into .hdr-label, never
       the button's own textContent, or the icon goes with it. -->
  <header>
    <button id="btn-nav" class="hdr-nav" onclick="toggleNav()"
            aria-controls="tab-nav" aria-expanded="false" aria-label="Sections"
            title="Sections">☰</button>
    <div class="header-id">
      <!-- The product is Flood-Net in everything a person reads: this banner
           (#191), the page titles, every label, message and help entry, the
           files it downloads and the agent API. "meganet" survives only where
           nobody reads it as a name — the repository, the database schema,
           storage keys, MQTT topics, the Worker and bucket names, and the
           Quansheng radio's station-table tag — because renaming those is a
           migration with a thousand edges and nothing gained on screen. -->
      <h1>Flood-Net</h1>
      <p class="header-sub">
        <span class="header-tag">Network Tool</span>
        <span id="hdr-stats" class="header-stats"></span>
      </p>
    </div>
    <div class="header-actions">
      <!-- 📂 Load stations.json and ⬇️ Load from GitHub were here; they are on
           the Admin tab now (admin.js), as Load from this device / GitHub. The file input stays in the page because
           both that tab and the empty state open it. -->
      <input type="file" id="file-input" accept=".json" style="display:none" onchange="onFileLoad(this)">
      <!-- Sign-in is only needed to edit; the label becomes the signed-in
           person's name once there is one (Auth.syncHeader). -->
      <!-- ✨ What's new: shown while this device has changes it has not looked
           at (whats-new.js), hidden otherwise — which is most of the time. -->
      <button id="btn-whatsnew" class="hdr-btn hdr-new" onclick="WhatsNew.open()"
              title="What's new in Flood-Net since you last looked" hidden>
        <span class="hdr-ico" aria-hidden="true">✨</span><span class="hdr-label">What's new</span>
      </button>
      <!-- One box for a station, a place, a tab or an action (palette.js); the
           same as Ctrl/Cmd+K, for anybody who has not met the chord. -->
      <button id="btn-palette" class="hdr-btn" onclick="Palette.open()"
              title="Search for a station, a place, a tab or an action (Ctrl+K)">
        <span class="hdr-ico" aria-hidden="true">🔎</span><span class="hdr-label">Search</span>
      </button>
      <button id="btn-auth" class="hdr-btn" onclick="Auth.open()" title="Sign in to edit stations">
        <span class="hdr-ico" aria-hidden="true">🔑</span><span class="hdr-label">Sign in</span>
      </button>
      <button id="btn-report" class="hdr-btn" onclick="BugReport.open()" title="Report a bug or suggest an improvement">
        <span class="hdr-ico" aria-hidden="true">🐞</span><span class="hdr-label">Report a Bug</span>
      </button>
      <button id="btn-theme" class="hdr-btn" onclick="openThemeMenu()" title="Theme">
        <span class="hdr-ico" aria-hidden="true">🌗</span><span class="hdr-label">Theme</span>
      </button>
      <!-- ⋮: on a phone's Stations tab, the side panel's rail, put away so that
           the map has the screen (toggleDockRail, app.js). Last in the row so
           it is at the far right, opposite ☰ and the side its panel comes
           from; hidden until app.js finds itself on that tab at that width. -->
      <button id="btn-side" class="hdr-side" onclick="toggleDockRail()"
              aria-controls="help-panel" aria-expanded="false" aria-label="Side panel"
              title="Side panel: the station list, the filters and the map's tools" hidden>⋮</button>
    </div>
  </header>

  <!-- How much this page is holding, and a way to give it back — see issue #79.
       Hidden until stations.json has loaded (nothing to report before then);
       app.js fills it in and keeps it live. -->
  <div id="mem-bar" class="mem-bar" role="button" tabindex="0"
       aria-label="Memory usage — click for details"
       aria-controls="mem-modal" aria-expanded="false"
       onclick="MemMeter.togglePanel()"
       onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();MemMeter.togglePanel();}"
       hidden></div>

  <!-- Tapping the page behind the phone nav drawer closes it. Inert and
       invisible until #tab-nav is open. -->
  <div id="nav-backdrop" onclick="setNavCollapsed(true)" hidden></div>
  <!-- The same, for the side panel's drawer — help, or on the Stations tab one
       of the map's panels beside the rail its tools stand in. Two backdrops
       rather than one shared between them because only one drawer is ever
       open on a phone — app.js closes whichever was open when the other
       opens — and a backdrop that has to work out which one it is dismissing
       is a bug waiting to be written. -->
  <div id="help-backdrop" onclick="dockDrawerClose()" hidden></div>

  <div id="app-shell">
    <nav id="tab-nav" aria-label="Sections">
      <!-- rendered by app.js -->
    </nav>

    <!-- tabindex="-1" so the skip link and the phone tab switch have somewhere
         to put focus. Not in the tab order — -1 means "focusable by script,
         never by Tab" — and #main-content:focus drops the ring for a mouse
         click while :focus-visible keeps it for the keyboard (styles.css). -->
    <main id="main-content" tabindex="-1">
      <!-- rendered by app.js -->
    </main>

    <!-- The side panel (the "dock"): a strip of buttons on the outer edge — ❔
         Help, 📍 the Stations cards and 〽️ the path tools on that tab, and on that tab every one of
         the Stations map's own controls but ↺, which would otherwise stand in the
         map's corner (↺ stays there) — and, open, one pane beside the strip, with a handle on
         its inner edge that sets its width. The one complementary landmark on the
         page, and still #help-panel, the id the help rail it grew out of had:
         the print sheet, the reduced-motion rule and every check that finds
         the ❔ toggle reach it by that name.

         Its skeleton is built once, by the first renderHelp() (app.js,
         dockSkeleton), and never rewritten wholesale after — the panes and the
         strip hold live things, the Stations cards and the map's panels and
         buttons, that a template written over them would destroy. It starts
         collapsed in the markup so the paint before app.js runs is the strip
         alone; the state is applied before the width transition is allowed —
         see .help-ready. In the Stations map's full screen it stays on screen,
         fixed beside the map (styles.css, .map-panel.is-full).

         No header button pairs with this the way ☰ pairs with the nav: the
         header had a slot on the left for ☰ and has none on the right, and a
         seventh button there wrapped the banner onto another row on a phone.
         Below 560 px a pane opens as a drawer over the page. On the Stations
         tab the strip is still a rail down the right-hand edge, holding the
         map's controls off the map; on every other tab, where it holds only
         ❔, it becomes a fixed tab on the screen edge instead — still always
         present, but costing no layout width. See styles.css. -->
    <aside id="help-panel" class="collapsed" aria-label="Side panel">
      <!-- built by app.js -->
    </aside>
  </div>

  <!-- THE ORDER OF THESE SCRIPTS IS THE CONTRACT (#129/#132).
       Later work *adds* files to this list; it does not reorder it, and it does
       not move a file's position within it.

         leaflet → maps-data.js → core.js → …modules… → init.js

       These are classic scripts, deliberately — not ES modules. They share one
       global lexical environment, which is what keeps the 358 inline on*=
       handlers resolving, keeps file:// working, and keeps
       document.currentScript non-null. #129 records the four independent
       reasons in full. The cost is that load order is load-bearing:

         core.js   constants, state, shared utilities, the Leaflet canvas guard.
                   Everything the modules reach backwards for. Nothing reaches
                   backwards past it, so it goes first.
         …modules… the tabs and features. They may call each other in any
                   direction, because none of it runs until init.js does.
         init.js   the only thing that executes at load. It goes last so that
                   every top-level binding above it is already initialised —
                   which is what retires the TDZ crashes in #131.

       Every file names what it exposes and what must precede it in a header
       comment, the convention maps-data.js already uses. The test harness reads
       this list rather than keeping its own copy, so adding a file here is all
       that is needed to bring it under test — see test/README.md.

       "None of it runs until init.js does" is the claim the whole order rests
       on, and since #142 it is checked rather than asserted: `npm run toplevel`
       parses every file above and fails on a statement that executes at load.
       If you need something to happen at startup, it goes in init.js. If your
       module needs to register something with the shell — a Leaflet map to
       re-measure, a loop to stop when its tab is left — it does that from its
       own init(), not from its top level. core.js holds both registries.

       ?v= is a cache-buster: bump it whenever the file changes so browsers and
       GitHub Pages fetch the new copy instead of a stale one. One shared stamp
       across all of them, bumped together, rather than a stamp per file: these
       are slices of one program and they deploy as a set, so a partial bump can
       only ever produce a mismatched pair. core.js must carry one regardless —
       APP_VERSION reads it back off this very tag, and an unstamped core.js
       makes every bug report say 'dev'. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script src="maps-data.js?v=20261007l"></script>
  <script src="core.js?v=20261007l"></script>
  <!-- The furniture the seven Leaflet maps share: the base-map picker, and the
       on-map panel every other control on a map is built out of (#164). Above
       app.js because that is where it reads — the first map in the list is the
       Stations map and this is what its corner is made of — not because it has
       to be: like every other module here it only declares. -->
  <!-- The Elevation base map: terrarium tiles decoded in the browser and
       banded through the Radio Mobile colour file. Above map-controls.js
       because makeBaseLayers() names it — a runtime read, like every other

  <script src="map-elevation.js?v=20261007l"></script>
  <script src="map-controls.js?v=20261007l"></script>
  <script src="app.js?v=20261007l"></script>
  <script src="rf-changes.js?v=20261007l"></script>
  <script src="workbench.js?v=20261007l"></script>
  <!-- The Reception Map tab: what was heard where, and which repeater is
       sending bad copies. Reads reception-log.js at runtime only. -->
  <script src="reception.js?v=20261007l"></script>
  <script src="mem-meter.js?v=20261007l"></script>
  <script src="auth.js?v=20261007l"></script>
  <script src="map-draw.js?v=20261007l"></script>
  <script src="path-profile.js?v=20261007l"></script>
  <script src="link-budget.js?v=20261007l"></script>
  <script src="pass-ranges.js?v=20261007l"></script>
  <script src="bit-flipper.js?v=20261007l"></script>
  <script src="network-view.js?v=20261007l"></script>
  <script src="arro-launcher.js?v=20261007l"></script>
  <script src="arro-data.js?v=20261007l"></script>
  <script src="datastore.js?v=20261007l"></script>
  <script src="export.js?v=20261007l"></script>
  <script src="station-editor.js?v=20261007l"></script>
  <!-- The Inspections section at the foot of the card station-editor.js
       renders: the door into Inspection History for one station, and the chart

       where it is called from, not because it has to be — like every other

  <script src="station-inspections.js?v=20261007l"></script>
  <script src="attachments.js?v=20261007l"></script>
  <!-- What a field photo says about where and when it was taken — its EXIF,

  <script src="photo-zip.js?v=20261007l"></script>
  <!-- What a photo's equipment labels say: make, model, serial number, and the

       Before field-photos.js and photo-review.js, which call it. -->
  <script src="photo-equipment.js?v=20261007l"></script>
  <!-- The Field Photos tab and the viewer every other part of the app opens a

       relationship like every other one here (#154). -->
  <script src="field-photos.js?v=20261007l"></script>
  <!-- The Field Photos tab's Review panel — what became of every upload, and

       station card's Equipment section. After field-photos.js, whose tab

  <script src="photo-review.js?v=20261007l"></script>
  <!-- The station card's History — who changed the station, what and when, a

  <script src="station-history.js?v=20261007l"></script>
  <script src="inspections.js?v=20261007l"></script>
  <script src="maintenance.js?v=20261007l"></script>
  <script src="history.js?v=20261007l"></script>
  <script src="map-rivers.js?v=20261007l"></script>
  <script src="map-catchments.js?v=20261007l"></script>
  <script src="map-hubs.js?v=20261007l"></script>
  <script src="sls.js?v=20261007l"></script>

  <script src="flood-velocity.js?v=20261007l"></script>
  <!-- A station's flood levels on one ladder in m AHD — the classes through

       colour the Digital Twin's water takes past each. Pure, like the file
       above, whose AEP row it reads (at call time). Only declares. -->
  <script src="flood-stages.js?v=20261007l"></script>
  <!-- The flood classes, crossings and gauge survey the Bureau's river height
       station lists give a station (0031, 0032), and the AEP flood levels
       (0033): a section each on the station card, and their lists in the
       station editor. Only declares, like sls.js above. -->
  <script src="river-details.js?v=20261007l"></script>
  <!-- What the water and the ground around a station are likely to do to what
       is built there — tidal water, the Water Act's downstream limits, the
       coastal hazard areas, acid sulfate soils — asked of the Queensland
       Government's map services when a station card opens: a section on the
       card beside the two above. After river-details.js because it reads the
       gauge zero rule there (at call time); only declares. -->
  <script src="site-exposure.js?v=20261007l"></script>
  <!-- The land a station stands on — its lot, tenure, who holds that kind of
       land, the council area, the address and the land use — asked of the
       Queensland cadastre when a station card or the What is here card opens:
       a section on each. Only declares; app.js and map-here.js call it. -->
  <script src="site-land.js?v=20261007l"></script>
  <!-- A station's RX/TX frequency pairs beyond a repeater's own (0033): rows in
       the station editor and a line each on the card. Only declares. -->
  <script src="frequencies.js?v=20261007l"></script>
  <script src="map-survey.js?v=20261007l"></script>
  <script src="map-contours.js?v=20261007l"></script>
  <!-- Beside the contours because it is the same kind of thing: a context
       layer over the base map with no bearing on the physics. It draws which
       DEM resolution exists where, which is the question the contours' own
       source raises and this app could not previously answer. -->
  <script src="map-elvis-coverage.js?v=20261007l"></script>
  <!-- Road parcels from the Queensland cadastre. Beside the survey marks and
       the contours because it is the same kind of thing — a Qld spatial
       service drawn under the pins — not because it has to be: like every
       other module here it only declares. -->
  <script src="map-roads.js?v=20261007l"></script>
  <!-- Every lot boundary from the same cadastre, as a server-rendered image.
       Beside map-roads.js because it is the same service; it only declares. -->
  <script src="map-lots.js?v=20261007l"></script>
  <!-- The field photos on the Stations map: a pin where each was taken. After
       field-photos.js, whose photos and viewer it uses, and beside the other
       layers drawn over the base map; it only declares. -->
  <script src="map-photos.js?v=20261007l"></script>
  <script src="map-wind.js?v=20261007l"></script>
  <script src="map-spider.js?v=20261007l"></script>
  <!-- The gold line from the station card to its pin, which replaced the
       desktop callout. Beside map-spider.js because it is the same kind of
       thing — a mark over the pins that follows them — and it only declares. -->
  <script src="map-leader.js?v=20261007l"></script>
  <script src="map-backbone.js?v=20261007l"></script>
  <script src="map-blast.js?v=20261007l"></script>
  <!-- 📍 Find a place, the blue pin in the side panel on the Stations tab: a
       coordinate it parses, the catchments, rivers and council areas the
       station file holds, and the towns, localities and rivers the gazetteer
       names — the map taken there; and a coordinate pair pasted into any
       latitude or longitude box in the app, split between the two. Beside
       map-locate.js because it is the same kind of thing — a way of getting
       the map somewhere that is not a pin — and like every other module here
       it only declares, so its position states the dependency (#154). -->
  <script src="places.js?v=20261007l"></script>
  <script src="map-locate.js?v=20261007l"></script>
  <!-- Armed from the station editor card and from the station card on the
       map, both of which are rendered elsewhere; this only declares the mode. After
       map-blast.js because it is the same kind of thing — a mode on the
       Stations map that one station at a time is in. -->
  <script src="map-move-pin.js?v=20261007l"></script>
  <script src="terrain.js?v=20261007l"></script>
  <!-- Beside terrain.js and emphatically not a replacement for it: one point
       per request, no batch, ~2.5 s a call. It answers about a place a person
       clicked, in AHD and naming the dataset — which is the one thing the
       tiles cannot do. The sweeps never reach it; its own header says why. -->
  <script src="elvis.js?v=20261007l"></script>
  <!-- How far AHD is above the EGM96 geoid at a point (AUSGeoid2020 less

  <script src="geoid.js?v=20261007l"></script>
  <script src="itm.js?v=20261007l"></script>
  <script src="land-cover.js?v=20261007l"></script>

       being required by it (#154). -->
  <script src="map-peaks.js?v=20261007l"></script>
  <!-- After terrain.js because that is what it asks for tiles through, and

  <script src="map-arrows.js?v=20261007l"></script>

  <script src="map-sites.js?v=20261007l"></script>

       tiles terrain.js decodes, with the same base map draped on the relief and

       because it stands on the most of it — terrain.js for the ground under a
       hop, path-profile.js for the geometry of the line-of-sight sheet,
       map-controls.js for the panel it is opened from, and app.js for the
       Leaflet map whose layers it mirrors. All runtime calls, so the position
       states the dependencies rather than being required by them (#154).

       The renderer itself is NOT in this list. It is ~1 MB of WebGL fetched on
       the first press of ⛰️ and never for a session that does not press it —
       the one deliberate exception to "everything the page needs is named
       here", and map-3d.js's header says why at length. -->
  <script src="map-3d.js?v=20261007l"></script>
  <!-- The digital twin: one station's patch of ground in three dimensions,
       at a scale the 3-D map above does not go to — the State's 1 m LiDAR, the
       aerial imagery, a 2 m pole and a figure for scale, and a camera that can
       stand on the ground. Drawn inside the Stations map (map-twin.js, below),
       its settings the 🧊 pane of that tab's side panel. After terrain.js,
       elvis.js and geoid.js because it reads the fallback ground through the
       first, the height at the pin through the second, and puts the fallback
       ground into AHD through the third; beside map-3d.js because it is the
       same kind of thing at the other end of the scale. All runtime calls, so
       the position states the dependencies rather than being required by them
       (#154).

       Its renderer, three.js, is not in this list either, and for map-3d.js's
       reason — fetched on the first twin opened and never for a session that
       does not open one. Unlike MapLibre it has no UMD build any more, so
       it arrives by a dynamic import() from inside the module; the page itself
       stays classic scripts. digital-twin.js's header says why. -->
  <script src="digital-twin.js?v=20261007l"></script>
  <!-- Who else is in a station's twin: a room per station on Supabase Realtime
       (presence for who is there, broadcast for where they stand), an avatar
       for each of them in the scene. After digital-twin.js, whose seams it
       drives, and before map-twin.js, which hosts the same scene. All runtime
       calls (#154); the socket is opened when a twin is built and closed with
       it. -->
  <script src="twin-presence.js?v=20261007l"></script>
  <!-- The Queensland cadastre on the twin's ground: every lot's boundary with
       its lot number and plan, and the road reserve outlined and named — the
       Stations map's Property boundaries and Road parcels, draped on the
       twin's own triangles. After digital-twin.js, which hands it the scene
       to draw into when a twin is built, and before map-twin.js, which hosts
       the same scene. All runtime calls (#154). -->
  <script src="twin-cadastre.js?v=20261007l"></script>
  <!-- The same twin inside the Stations map: from zoom 17 with a station under
       the view the map's rectangle hands over to it, and takes it back on the
       way out. After digital-twin.js, whose scene it hosts, and after map-3d.js,
       whose window over the map it stands one step above. All runtime calls
       (#154). -->
  <script src="map-twin.js?v=20261007l"></script>
  <!-- The stations looked at this session, as a pill in the Stations map's top
       row: it brings a closed station card back, and drops down the trail of
       stations looked at, each a way back to it. After map-twin.js, whose
       stage it stands at the top of while the twin is up, and after app.js
       and map-leader.js, whose card and centre it uses. All runtime calls
       (#154). -->
  <script src="station-trail.js?v=20261007l"></script>
  <!-- 🔭 The AR station finder, a tool in the Stations side panel: a phone held

       the compass turned to true north by the World Magnetic Model whose
       coefficients it carries. After app.js, whose filters, station card and
       side panel it uses, and beside station-trail.js because it is the same
       kind of thing — a way to a station that is not the list. All runtime
       calls (#154); the camera, the GPS and the compass are opened by a press
       and closed with the view. -->
  <script src="station-ar.js?v=20261007l"></script>
  <script src="modal.js?v=20261007l"></script>
  <!-- A line at the foot of the window saying how something just went — done,
       or failed and why — in place of the browser's alert() (#223). After
       core.js (announce, esc), which it reads at call time; nothing runs at
       load. modal.js above it asks the questions confirm() and prompt() used
       to. -->
  <script src="toast.js?v=20261007l"></script>
  <script src="packets.js?v=20261007l"></script>
  <!-- Following a log file as it grows, for the ALERT2 tab's Watch and the

  <script src="log-follow.js?v=20261007l"></script>
  <script src="alert2.js?v=20261007l"></script>
  <script src="hfem.js?v=20261007l"></script>
  <!-- After hfem.js, which it renders the output of. Neither executes at load,
       so nothing would actually break the other way round — the order is here
       because it states the dependency, which is what this list is for (#154). -->
  <script src="hfem-tab.js?v=20261007l"></script>
  <script src="network-maps.js?v=20261007l"></script>
  <!-- The Serial Monitor's devices (#serial expansions): the codecs and the

       the dependency rather than enforcing one. -->
  <script src="serial-viz.js?v=20261007l"></script>

  <script src="reception-log.js?v=20261007l"></script>
  <script src="quansheng.js?v=20261007l"></script>
  <script src="alert-dsp.js?v=20261007l"></script>
  <script src="rtlsdr.js?v=20261007l"></script>
  <!-- The text an RTL-SDR on a Raspberry Pi prints for PuTTY (sdr-pi/relay.js

  <script src="sdr-pi.js?v=20261007l"></script>

       meganet.ingest_http() with an ingest token (docs/ingest-serial-monitor.md).

  <script src="serial-ingest.js?v=20261007l"></script>
  <script src="serial-radio.js?v=20261007l"></script>
  <script src="serial-sdr.js?v=20261007l"></script>
  <!-- The ERT-A2 card: alert2.js's codec, live. After alert2.js, whose parser

  <script src="serial.js?v=20261007l"></script>

       when it is shared, and what its count is in volts or millimetres — or
       why not. Before the Message Log and the Station Health tab, which both

  <script src="sensor-values.js?v=20261007l"></script>
  <script src="message-log.js?v=20261007l"></script>
  <script src="bug-report.js?v=20261007l"></script>
  <script src="map-generator.js?v=20261007l"></script>
  <!-- The Admin tab's ingest tokens (0046): list, mint, revoke — instead of

  <script src="admin-tokens.js?v=20261007l"></script>
  <script src="admin.js?v=20261007l"></script>
  <script src="admin-dashboard.js?v=20261007l"></script>
  <!-- The Base Stations tab (0049): what checks in, and what an administrator

  <script src="base-stations.js?v=20261007l"></script>

       findings out — test/health.mjs holds it to a week whose answer is

  <script src="health-analysis.js?v=20261007l"></script>
  <script src="health.js?v=20261007l"></script>
  <script src="health-agent.js?v=20261007l"></script>

  <script src="site-map.js?v=20261007l"></script>

  <script src="palette.js?v=20261007l"></script>

       newDevice at call time; nothing runs at load — init.js starts it. -->
  <script src="whats-new.js?v=20261007l"></script>

       forward move between tabs (#211). After app.js (switchTab,
       showStationCard, closeStnCard) and map-leader.js, which it calls at call
       time; nothing runs at load — init.js starts it, first thing. -->
  <script src="route.js?v=20261007l"></script>
  <script src="init.js?v=20261007l"></script>
