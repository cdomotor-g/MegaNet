<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MegaNet</title>
  <link rel="stylesheet" href="styles.css?v=20260729b">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

  <header>
    <div>
      <h1>MegaNet</h1>
      <p>Network &amp; Tool</p>
    </div>
    <div class="header-actions">
      <span id="hdr-stats" class="small" style="color:rgba(255,255,255,.75)"></span>
      <input type="file" id="file-input" accept=".json" style="display:none" onchange="onFileLoad(this)">
      <button onclick="document.getElementById('file-input').click()">Load stations.json</button>
      <button id="btn-load-gh" onclick="loadFromGitHub()">Load from GitHub</button>
      <button id="btn-report" onclick="BugReport.open()" title="Report a bug or suggest an improvement">🐞 Report a Bug</button>
      <button id="btn-theme" onclick="toggleTheme()">Dark</button>
    </div>
  </header>

  <nav id="tab-bar">
    <!-- rendered by app.js -->
  </nav>

  <main id="main-content">
    <!-- rendered by app.js -->
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- ?v= is a cache-buster: bump it whenever app.js / maps-data.js / styles.css
       change so browsers and GitHub Pages fetch the new file instead of a stale
       copy. -->
  <script src="maps-data.js?v=20260723a"></script>
  <script src="app.js?v=20260729b"></script>
</body>
</html>
