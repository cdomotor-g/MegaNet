<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MegaNet</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <meta name="theme-color" content="#0b5cab">
  <link rel="stylesheet" href="styles.css?v=20260808c">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

  <header>
    <div>
      <h1>MegaNet</h1>
      <p>Network Tool</p>
    </div>
    <div class="header-actions">
      <span id="hdr-stats" class="small" style="color:rgba(255,255,255,.75)"></span>
      <input type="file" id="file-input" accept=".json" style="display:none" onchange="onFileLoad(this)">
      <button onclick="document.getElementById('file-input').click()">Load stations.json</button>
      <button id="btn-load-gh" onclick="loadFromGitHub()">Load from GitHub</button>
      <button id="btn-report" onclick="BugReport.open()" title="Report a bug or suggest an improvement">🐞 Report a Bug</button>
      <button id="btn-theme" onclick="toggleTheme()">Dark</button>
    </div>
  </header>

  <div id="app-shell">
    <nav id="tab-nav" aria-label="Sections">
      <!-- rendered by app.js -->
    </nav>

    <main id="main-content">
      <!-- rendered by app.js -->
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- ?v= is a cache-buster: bump it whenever app.js / maps-data.js / styles.css
       change so browsers and GitHub Pages fetch the new file instead of a stale
       copy. -->
  <script src="maps-data.js?v=20260723a"></script>
  <script src="app.js?v=20260808c"></script>
</body>
</html>
