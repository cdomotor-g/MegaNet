# Cloudflare deploy config. The dashboard's git-connect flow ("Workers Builds")
# requires a deploy command — the default `npx wrangler deploy` — and that
# command needs this file to know what to deploy. MegaNet is very nearly
# assets-only — the whole repository root served as static files, same as GitHub
# Pages serves it — plus the single Worker route named below.
# See docs/floodwarning-net.md.
#
# `name` must exactly match the project name in the Cloudflare dashboard or
# the build fails.
name = "meganet"
compatibility_date = "2026-08-27"

# The two routes that are not static files. /api/session exchanges a Cloudflare
# Access identity for a Supabase session, so the app asks for one login rather
# than two (#173). /api/db/* forwards the database, its sign-in and its storage
# to the Supabase project, so the browser only ever names this origin — which is
# what keeps the app reachable from a network that denies hostnames its filter
# has not categorised (docs/floodwarning-net.md).
#
# Assets are still served first, so only paths that are not files in this repo
# ever reach the Worker. `/api/db/` rather than `/db/` for exactly that reason:
# `db/` at the repo root is a real directory of migrations and is served.
# See worker/index.js.
main = "worker/index.js"

[assets]
directory = "."
# The Worker reads one of those files itself: /api/cameras/* (worker/cameras.js)
# looks a camera up in data/council-cameras.json, the same file the map draws,
# through this binding — the first time an isolate needs it, so the routes that
# never touch a camera load nothing more than they did. Assets are still served
# before the Worker runs; the binding changes nothing about that.
binding = "ASSETS"

# The field photos' bytes (worker/photos.js, /api/photos/*): Cloudflare R2, 10 GB
# free and nothing charged to read out of, instead of Supabase Storage's 1 GB.
# The bucket was created by hand in the dashboard first: a binding to a bucket
# the account cannot create fails every deploy. Unbound, the route answers 503
# {unbound: true} and the app and the syncs fall back to Supabase Storage.
# docs/field-photos.md ("Where the bytes live") has the steps.

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "meganet-photos"

# The data archive (worker/archive.js, /api/archive/*, #243): every UTC day of
# readings, submissions and receptions, gzipped NDJSON, before the database
# ages them out. Created 2026-10-21 through the Cloudflare connector, before
# this binding, because a binding to a bucket that does not exist fails the
# deploy.
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "meganet-archive"

# Ask Claude on Flood-Net's key (worker/briefing.js, /api/briefing): the day's
# spend, the calls in flight and each person's last minute, kept by one Durable
# Object so the daily ceiling holds across every isolate and location. Declared
# here, it is created by the deploy — nothing to make in the dashboard first —
# and SQLite-backed, the kind the Workers Free plan offers. The class is
# exported by worker/index.js. The route's one secret, ANTHROPIC_API_KEY, is
# set by a person (docs/access.md); until it is, the route answers 503 and the
# tab offers the person's own key.

[[durable_objects.bindings]]
name = "BRIEFING_LEDGER"
class_name = "BriefingLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BriefingLedger"]

# The read-only agent API (/api/v1/*, /api/mcp — worker/api.js,
# docs/agent-api.md) is throttled by Cloudflare's rate limiting binding: three
# rules, keyed on a hash of the caller's address plus the name it gives in
# X-FloodNet-Client, and on the address alone for the ceiling. The numbers must
# match RATE_LIMITS in worker/api.js — test/agent-docs.mjs checks that they do.
#
# Per Cloudflare location and eventually consistent: a brake, not a quota.
# `period` may only be 10 or 60. `namespace_id` is any positive integer unique
# within the account; nothing has to be created in the dashboard first.
# Needs wrangler 4.36 or later. An older wrangler warns "Unexpected fields found
# in top-level field: ratelimits" and deploys without them; the API then falls
# back to a per-isolate limiter and says so in its X-RateLimit-Limiter header.

[[ratelimits]]
name = "API_RATE_LIMIT"
namespace_id = "1101"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "API_BURST_LIMIT"
namespace_id = "1102"

  [ratelimits.simple]
  limit = 20
  period = 10

[[ratelimits]]
name = "API_IP_LIMIT"
namespace_id = "1103"

  [ratelimits.simple]
  limit = 240
  period = 60

# The bug reporter's Send (worker/report.js, /api/report): a few reports a
# minute from one address, keyed on a hash of it. Not part of the agent API —
# REPORT_RATE in worker/report.js holds the same numbers, and
# test/agent-docs.mjs checks the two agree.

[[ratelimits]]
name = "REPORT_RATE_LIMIT"
namespace_id = "1104"

  [ratelimits.simple]
  limit = 3
  period = 60

# Route on map (worker/drive.js, /api/drive, #251): the routes asked of
# FOSSGIS's Valhalla, on one key for everybody — FOSSGIS allows this
# application a request a second, and this keeps it to half that a minute per
# location, with the isolate's own one-a-second spacing under it. DRIVE_RATE
# in worker/drive.js holds the same numbers; test/agent-docs.mjs checks that
# they agree.

[[ratelimits]]
name = "DRIVE_RATE_LIMIT"
namespace_id = "1105"

  [ratelimits.simple]
  limit = 30
  period = 60

# The administrators' notifications (worker/push.js, 0066): every minute the
# Worker's scheduled() asks the database which devices have something to hear
# and sends it through Apple's, Google's, Mozilla's or Microsoft's push
# service. Its VAPID key is made on the first run and kept in the PHOTOS
# bucket, so there is nothing to set; without SUPABASE_SECRET_KEY a run
# returns before it asks anything. docs/accounts.md, "Notifications on a phone".
[triggers]
crons = ["* * * * *"]
