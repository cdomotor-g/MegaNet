# Cloudflare deploy config. The dashboard's git-connect flow ("Workers Builds")
# requires a deploy command — the default `npx wrangler deploy` — and that
# command needs this file to know what to deploy. MegaNet is very nearly
# assets-only — the whole repository root served as static files, same as GitHub
# Pages serves it — plus the single Worker route named below.
# See docs/floodwarning-net.md.
#
# `name` must exactly match the project name in the Cloudflare dashboard or
# the build fails.
name = "meganet"
compatibility_date = "2026-08-27"

# The two routes that are not static files. /api/session exchanges a Cloudflare
# Access identity for a Supabase session, so the app asks for one login rather
# than two (#173). /api/db/* forwards the database, its sign-in and its storage
# to the Supabase project, so the browser only ever names this origin — which is
# what keeps the app reachable from a network that denies hostnames its filter
# has not categorised (docs/floodwarning-net.md).
#
# Assets are still served first, so only paths that are not files in this repo
# ever reach the Worker. `/api/db/` rather than `/db/` for exactly that reason:
# `db/` at the repo root is a real directory of migrations and is served.
# See worker/index.js.
main = "worker/index.js"

[assets]
directory = "."
