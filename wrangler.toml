# Cloudflare deploy config. The dashboard's git-connect flow ("Workers Builds")
# requires a deploy command — the default `npx wrangler deploy` — and that
# command needs this file to know what to deploy. MegaNet is very nearly
# assets-only — the whole repository root served as static files, same as GitHub
# Pages serves it — plus the single Worker route named below.
# See docs/floodwarning-net.md.
#
# `name` must exactly match the project name in the Cloudflare dashboard or
# the build fails.
name = "meganet"
compatibility_date = "2026-08-27"

# The two routes that are not static files. /api/session exchanges a Cloudflare
# Access identity for a Supabase session, so the app asks for one login rather
# than two (#173). /api/db/* forwards the database, its sign-in and its storage
# to the Supabase project, so the browser only ever names this origin — which is
# what keeps the app reachable from a network that denies hostnames its filter
# has not categorised (docs/floodwarning-net.md).
#
# Assets are still served first, so only paths that are not files in this repo
# ever reach the Worker. `/api/db/` rather than `/db/` for exactly that reason:
# `db/` at the repo root is a real directory of migrations and is served.
# See worker/index.js.
main = "worker/index.js"

[assets]
directory = "."

# The field photos' bytes (worker/photos.js, /api/photos/*): Cloudflare R2, 10 GB
# free and nothing charged to read out of, instead of Supabase Storage's 1 GB.
# Commented out until the bucket exists — a binding to a bucket the account
# cannot create fails every deploy. Until it is bound the route answers 503
# {unbound: true} and the app and the syncs keep using Supabase Storage.
# docs/field-photos.md ("Where the bytes live") has the steps.
#
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "meganet-photos"

# The read-only agent API (/api/v1/*, /api/mcp — worker/api.js,
# docs/agent-api.md) is throttled by Cloudflare's rate limiting binding: three
# rules, keyed on a hash of the caller's address plus the name it gives in
# X-MegaNet-Client, and on the address alone for the ceiling. The numbers must
# match RATE_LIMITS in worker/api.js — test/agent-docs.mjs checks that they do.
#
# Per Cloudflare location and eventually consistent: a brake, not a quota.
# `period` may only be 10 or 60. `namespace_id` is any positive integer unique
# within the account; nothing has to be created in the dashboard first.
# Needs wrangler 4.36 or later. An older wrangler warns "Unexpected fields found
# in top-level field: ratelimits" and deploys without them; the API then falls
# back to a per-isolate limiter and says so in its X-RateLimit-Limiter header.

[[ratelimits]]
name = "API_RATE_LIMIT"
namespace_id = "1101"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "API_BURST_LIMIT"
namespace_id = "1102"

  [ratelimits.simple]
  limit = 20
  period = 10

[[ratelimits]]
name = "API_IP_LIMIT"
namespace_id = "1103"

  [ratelimits.simple]
  limit = 240
  period = 60
